<!DOCTYPE html>
<html lang="id" data-theme="light" data-eco="none">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SPACE FLOW – Smart Ecosystem Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SPACE FLOW — DESIGN SYSTEM v2.0 (RESPONSIVE FIXED)
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html { overflow-x: hidden; scroll-behavior: smooth; }

:root {
  --font: 'Inter','Poppins',system-ui,sans-serif;
  --sidebar-w: 240px;
  --topbar-h: 60px;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 18px;
  --shadow: 0 2px 16px rgba(0,0,0,.07);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.13);
  --transition: all .22s cubic-bezier(.4,0,.2,1);
  /* Light */
  --bg: #f4f6fb;
  --bg-card: #ffffff;
  --bg-sidebar: #ffffff;
  --bg-input: #f1f3f9;
  --text: #0f1117;
  --text-muted: #6b7280;
  --text-light: #9ca3af;
  --border: #e5e7eb;
  --border-light: #f3f4f6;
  /* Accents */
  --campus: #3b82f6;
  --campus-light: #eff6ff;
  --campus-border: #bfdbfe;
  --storage: #f59e0b;
  --storage-light: #fffbeb;
  --storage-border: #fde68a;
  --library: #10b981;
  --library-light: #ecfdf5;
  --library-border: #a7f3d0;
  /* Status */
  --green: #10b981; --yellow: #f59e0b; --red: #ef4444;
  --blue: #3b82f6; --purple: #8b5cf6; --orange: #f97316;
  /* Current accent (set by JS) */
  --accent: #3b82f6;
  --accent-light: #eff6ff;
  --accent-border: #bfdbfe;
}
[data-theme="dark"] {
  --bg: #0d1117; --bg-card: #161b22; --bg-sidebar: #13181f;
  --bg-input: #1e2530; --text: #e6edf3; --text-muted: #8b949e;
  --text-light: #6e7681; --border: #30363d; --border-light: #21262d;
  --shadow: 0 2px 16px rgba(0,0,0,.3); --shadow-lg: 0 8px 40px rgba(0,0,0,.4);
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  letter-spacing: .2px;
  font-size: 14px;
  overflow-x: hidden;
  min-height: 100vh;
  transition: background .25s, color .25s;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

/* ── SPLASH ─────────────────────────────────────────────── */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity .5s ease;
}
#splash.out { opacity: 0; pointer-events: none; }
.splash-ring {
  width: 72px; height: 72px; border-radius: 18px;
  background: linear-gradient(135deg,#3b82f6,#8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  box-shadow: 0 12px 40px rgba(59,130,246,.35);
  animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }
.splash-title { font-size: 36px; font-weight: 900; letter-spacing: -1.5px; margin-top: 14px; animation: fadeUp .5s ease .15s both; }
.splash-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 4px; animation: fadeUp .5s ease .25s both; }
.splash-chips { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: center; animation: fadeUp .5s ease .35s both; }
.splash-chip { font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-muted); }
.splash-bar { width: 180px; height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 36px; animation: fadeUp .5s ease .45s both; }
.splash-fill { height: 100%; background: linear-gradient(90deg,#3b82f6,#8b5cf6,#10b981); animation: barFill 1.6s ease forwards; }
@keyframes barFill { from{width:0} to{width:100%} }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ── APP SHELL ───────────────────────────────────────────── */
#app { display: none; min-height: 100vh; overflow-x: hidden; }
#app.ready { display: block; }

/* ── LOGIN PAGE ──────────────────────────────────────────── */
.login-page {
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center;
  padding: 20px; position: relative; overflow: hidden;
}
.login-bg {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 65% 60% at 25% 35%, rgba(59,130,246,.08), transparent),
              radial-gradient(ellipse 50% 55% at 75% 70%, rgba(139,92,246,.06), transparent);
}
.login-wrap { position: relative; z-index: 1; width: 100%; max-width: 960px; }
.login-header { text-align: center; margin-bottom: 36px; animation: fadeUp .5s ease both; }
.login-logo { font-size: 44px; font-weight: 900; letter-spacing: -2px; }
.login-tagline { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.login-eco-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  animation: fadeUp .5s ease .1s both;
}
.eco-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  cursor: pointer; text-align: center;
  transition: var(--transition);
  user-select: none;
}
.eco-card:hover { border-color: var(--accent); background: var(--accent-light); transform: translateY(-3px); box-shadow: var(--shadow); }
.eco-card-icon { font-size: 36px; margin-bottom: 10px; }
.eco-card-title { font-size: 14px; font-weight: 700; }
.eco-card-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

/* login card */
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 36px 32px;
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  box-shadow: var(--shadow-lg);
  animation: fadeUp .4s ease both;
}
@media (max-width: 480px) { .login-card { padding: 26px 18px; } }

/* ── LAYOUT ──────────────────────────────────────────────── */
.layout { display: flex; min-height: 100vh; position: relative; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  position: fixed; left: 0; top: 0; bottom: 0;
  display: flex; flex-direction: column;
  z-index: 200;
  transition: transform .28s cubic-bezier(.4,0,.2,1), box-shadow .28s;
  overflow-y: auto; overflow-x: hidden;
}
.sidebar-logo {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.logo-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo-icon {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg,#3b82f6,#8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; box-shadow: 0 4px 12px rgba(59,130,246,.28);
}
.logo-name { font-size: 15px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; }
.logo-sub { font-size: 9.5px; color: var(--text-muted); font-weight: 600; letter-spacing: .8px; text-transform: uppercase; }

/* eco badge in sidebar */
.eco-badge {
  margin: 10px 16px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 700;
  text-align: center;
  letter-spacing: .3px;
}
.eco-badge.campus { background: var(--campus-light); color: var(--campus); border: 1px solid var(--campus-border); }
.eco-badge.storage { background: var(--storage-light); color: var(--storage); border: 1px solid var(--storage-border); }
.eco-badge.library { background: var(--library-light); color: var(--library); border: 1px solid var(--library-border); }
.eco-badge.owner { background: #ede9fe; color: #7c3aed; border: 1px solid #c4b5fd; }

.sidebar-nav { flex: 1; padding: 8px 10px; overflow-y: auto; overflow-x: hidden; }
.nav-section { margin-bottom: 18px; }
.nav-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-light);
  padding: 0 8px; margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  cursor: pointer; color: var(--text-muted);
  font-size: 13px; font-weight: 500;
  transition: var(--transition);
  text-decoration: none;
  position: relative;
  min-width: 0; white-space: nowrap; overflow: hidden;
}
.nav-item span.ni-icon { flex-shrink: 0; font-size: 15px; width: 18px; text-align: center; }
.nav-item span.ni-label { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.nav-item:hover { background: var(--bg-input); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.nav-badge-dot {
  margin-left: auto; background: var(--red); color: #fff;
  font-size: 9.5px; font-weight: 800;
  min-width: 18px; height: 18px; border-radius: 99px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; flex-shrink: 0;
}

.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}
.user-pill {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; background: var(--bg-input);
  border-radius: var(--radius-sm); cursor: pointer;
  min-width: 0;
}
.user-ava {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg,var(--accent),var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
}
.user-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-role { font-size: 10.5px; color: var(--text-muted); }

/* sidebar overlay (mobile) */
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 199;
}

/* MAIN CONTENT */
.main {
  margin-left: var(--sidebar-w);
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  min-height: 100vh;
  max-width: 100%;
  overflow-x: hidden;
}

/* TOPBAR */
.topbar {
  height: var(--topbar-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 100;
  gap: 12px; flex-shrink: 0;
  min-width: 0;
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; overflow: hidden; }
.topbar-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.ham-btn {
  display: none; background: none; border: none;
  cursor: pointer; color: var(--text); padding: 5px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}

.icon-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  background: var(--bg-input); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted);
  transition: var(--transition); position: relative; flex-shrink: 0;
}
.icon-btn:hover { color: var(--text); background: var(--border); }
.icon-btn .dot {
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); border: 1.5px solid var(--bg-card);
}

/* PAGE */
.page { padding: 22px; animation: fadeIn .28s ease; flex: 1; min-width: 0; overflow-x: hidden; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ── PAGE HEADER ─────────────────────────────────────────── */
.page-hd {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 14px;
  margin-bottom: 22px; flex-wrap: wrap;
}
.page-title { font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
.page-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

/* ── STATS GRID ──────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px; margin-bottom: 22px;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  position: relative; overflow: hidden;
  transition: var(--transition);
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; background: var(--accent);
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.stat-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.stat-val { font-size: 26px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; word-break: break-word; }
.stat-chg { font-size: 11.5px; margin-top: 4px; }
.stat-chg.up { color: var(--green); }
.stat-chg.dn { color: var(--red); }
.stat-ico { position: absolute; top: 16px; right: 16px; font-size: 32px; opacity: .12; }

/* ── CARD ────────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: var(--transition);
  overflow: hidden;
}
.card:hover { box-shadow: var(--shadow); }

/* ── GRID HELPERS ────────────────────────────────────────── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 18px; }

/* ── SECTION HEADER ──────────────────────────────────────── */
.sec-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.sec-title { font-size: 15px; font-weight: 700; }
.sec-link { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 600; white-space: nowrap; }
.sec-link:hover { text-decoration: underline; }

/* ── BADGE / STATUS ──────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 99px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.bg-green { background: #d1fae5; color: #065f46; }
.bg-yellow { background: #fef3c7; color: #92400e; }
.bg-red { background: #fee2e2; color: #991b1b; }
.bg-blue { background: #dbeafe; color: #1e40af; }
.bg-purple { background: #ede9fe; color: #6d28d9; }
.bg-orange { background: #ffedd5; color: #9a3412; }
.bg-gray { background: var(--bg-input); color: var(--text-muted); }
[data-theme="dark"] .bg-green { background: rgba(16,185,129,.15); color: #34d399; }
[data-theme="dark"] .bg-yellow { background: rgba(245,158,11,.15); color: #fbbf24; }
[data-theme="dark"] .bg-red { background: rgba(239,68,68,.15); color: #f87171; }
[data-theme="dark"] .bg-blue { background: rgba(59,130,246,.15); color: #60a5fa; }
[data-theme="dark"] .bg-purple { background: rgba(139,92,246,.15); color: #a78bfa; }
[data-theme="dark"] .bg-orange { background: rgba(249,115,22,.15); color: #fb923c; }

.s-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.sd-available { background: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,.2); }
.sd-pending { background: #f59e0b; }
.sd-booked { background: #ef4444; }
.sd-in_use { background: #3b82f6; animation: pulse-sd 1.5s infinite; }
.sd-maintenance { background: #f97316; }
.sd-cleaning { background: #8b5cf6; }
@keyframes pulse-sd { 0%,100%{box-shadow:0 0 0 2px rgba(59,130,246,.2)} 50%{box-shadow:0 0 0 6px rgba(59,130,246,0)} }

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: none; transition: var(--transition);
  font-family: var(--font); text-decoration: none;
  white-space: nowrap; flex-shrink: 0;
  line-height: 1;
}
.btn:disabled { opacity: .5; pointer-events: none; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-secondary { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--bg-input); color: var(--text); }
.btn-sm { padding: 5px 11px; font-size: 11.5px; }
.btn-lg { padding: 11px 22px; font-size: 14px; }
.btn-block { width: 100%; justify-content: center; }

/* ── FORMS ───────────────────────────────────────────────── */
.fgrp { margin-bottom: 14px; }
.flbl { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
.freq { color: var(--red); }
.finput, .fselect, .ftextarea {
  width: 100%; padding: 9px 12px;
  background: var(--bg-input); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: 13px;
  font-family: var(--font); color: var(--text);
  transition: var(--transition); outline: none;
  line-height: 1.5; min-width: 0;
}
.finput:focus, .fselect:focus, .ftextarea:focus {
  border-color: var(--accent); background: var(--bg-card);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
}
.ftextarea { resize: vertical; min-height: 76px; }
.ferr { font-size: 11.5px; color: var(--red); margin-top: 4px; }
.fhint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
.fgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ── TABLE ───────────────────────────────────────────────── */
.tbl-wrap {
  overflow-x: auto; border-radius: var(--radius);
  border: 1px solid var(--border); -webkit-overflow-scrolling: touch;
}
table { width: 100%; border-collapse: collapse; background: var(--bg-card); min-width: 480px; }
thead th {
  padding: 11px 14px; text-align: left;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  color: var(--text-muted); background: var(--bg-input);
  border-bottom: 1px solid var(--border); white-space: nowrap;
  position: sticky; top: 0; z-index: 1;
}
tbody td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border-light); vertical-align: middle; word-break: break-word; max-width: 220px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: var(--transition); }
tbody tr:hover { background: var(--bg-input); }

/* ── MODAL ───────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.52); backdrop-filter: blur(4px);
  z-index: 1000; display: flex;
  align-items: center; justify-content: center;
  padding: 16px;
  opacity: 0; visibility: hidden;
  transition: var(--transition);
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal-box {
  background: var(--bg-card); border-radius: var(--radius-lg);
  width: 100%; max-width: 560px;
  max-height: 92vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: scale(.96) translateY(10px);
  transition: var(--transition);
}
.modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
.modal-lg .modal-box { max-width: 780px; }
.modal-xl .modal-box { max-width: 960px; }
.modal-hd {
  padding: 20px 22px 0;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 6px; font-size: 16px; }
.modal-close:hover { background: var(--bg-input); color: var(--text); }
.modal-body { padding: 18px 22px; }
.modal-ft { padding: 0 22px 20px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ── SEARCH BAR ──────────────────────────────────────────── */
.search-wrap { position: relative; flex: 1; min-width: 0; max-width: 320px; }
.search-wrap input {
  width: 100%; padding: 8px 12px 8px 34px;
  background: var(--bg-input); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: 13px;

/* ── TOAST ──────────────────────────────────────────────── */
function toast(title, msg='', type='info', ms=4000) {
  const ico = {success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="font-size:17px;flex-shrink:0">${ico[type]}</span><div><div class="toast-title">${title}</div>${msg?`<div class="toast-msg">${msg}</div>`:''}</div>`;
  $('#toast-wrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.transform='translateX(110%)'; el.style.opacity='0'; setTimeout(()=>el.remove(),350); }, ms);
}

/* ── MODAL ──────────────────────────────────────────────── */
function openModal(id) { const e=$('#'+id); if(e){ e.classList.add('open'); document.body.style.overflow='hidden'; } }
function closeModal(id) { const e=$('#'+id); if(e){ e.classList.remove('open'); document.body.style.overflow=''; } }
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-overlay')) { e.target.classList.remove('open'); document.body.style.overflow=''; }
  if (e.target.classList.contains('modal-close') || e.target.closest?.('.modal-close')) {
    const o = e.target.closest?.('.modal-overlay'); if(o){o.classList.remove('open');document.body.style.overflow='';}
  }
});

/* ── CONFIRM ────────────────────────────────────────────── */
function confirmDlg(title, msg, yes, type='danger') {
  const id='__confirm'; $('#'+id)?.remove();
  const d=document.createElement('div');
  d.className='modal-overlay'; d.id=id;
  d.innerHTML=`<div class="modal-box" style="max-width:380px"><div class="modal-hd"><span class="modal-title">${title}</span></div><div class="modal-body"><p style="color:var(--text-muted);font-size:13.5px">${msg}</p></div><div class="modal-ft"><button class="btn btn-secondary" onclick="closeModal('${id}')">Batal</button><button class="btn btn-${type}" id="__yes">OK</button></div></div>`;
  document.body.appendChild(d);
  setTimeout(()=>d.classList.add('open'),10);
  $('#__yes').onclick = ()=>{ closeModal(id); yes&&yes(); };
}

  return (ST[eco+'Notif']||[]).filter(n=>n.target===u.username||n.target===u.role||(!n.target));
}

  $$('.topbar-notif-dot').forEach(el=>el.style.display=c?'block':'none');
}

/* ── PENDING TIMERS ─────────────────────────────────────── */
const _timers = {};
function startTimer(id, secs, onExp) {
  if(_timers[id]) clearInterval(_timers[id]);
  let r=secs;
  _timers[id]=setInterval(()=>{
    r--;
    const el=document.querySelector(`[data-timer="${id}"]`);
    if(el){ const m=Math.floor(r/60),s=r%60; el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; if(r<=60)el.closest('.countdown')?.classList.add('urgent'); }
    if(r<=0){ clearInterval(_timers[id]); onExp&&onExp(); }
  },1000);
}

/* ── SESSION ────────────────────────────────────────────── */
function saveSession() {
  localStorage.setItem(LS.session, JSON.stringify({user:ST.user, eco:ST.eco}));
}
function loadSession() {
  try { const s=JSON.parse(localStorage.getItem(LS.session)||'null'); if(s?.user){ ST.user=s.user; ST.eco=s.eco; return true; } } catch{}
  return false;
}
function doLogout() {
  ST.user=null; ST.eco=null;
  localStorage.removeItem(LS.session);
  document.body.style.overflow='';
  renderLogin();
}

function reqOTP(type) {
  let contact, db, errId='login-err';
  if (type==='storage_phone') {
    contact = $('#s-phone')?.value.trim();
    db = STORAGE_OTP;
  } else {
    contact = $('#l-email')?.value.trim();
    db = LIBRARY_OTP;
  }
  const errEl = $('#'+errId);
  if (!contact) { if(errEl){errEl.textContent='Masukkan nomor HP atau email'; errEl.style.display='block';} return; }
  const u = db[contact];
  if (!u) { if(errEl){errEl.textContent='Akun tidak ditemukan di ekosistem ini.'; errEl.style.display='block';} return; }
  _otpTmp = {contact, otp:u.otp, type, user:u};
  showOTPForm(contact, u.otp, type);
}

function showOTPForm(contact, otp, type) {
  const ecoColor = type==='storage_phone' ? 'var(--storage)' : 'var(--library)';
  $('#app').innerHTML = `
  <div class="login-page"><div class="login-bg"></div>
    <div class="login-wrap" style="max-width:420px">
      <div class="login-card">
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:40px">🔐</div>
          <div style="font-size:17px;font-weight:800;margin-top:8px">Verifikasi OTP</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px">Kode dikirim ke <b>${contact}</b></div>
        </div>
        <div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius-sm);padding:12px;text-align:center;margin-bottom:18px">
          <div style="font-size:11px;color:var(--text-muted)">Simulasi OTP:</div>
          <div style="font-size:26px;font-weight:800;letter-spacing:6px;color:${ecoColor}">${otp}</div>
        </div>
        <div class="otp-row" id="otp-row">
          ${[0,1,2,3,4,5].map(i=>`<input class="otp-box" maxlength="1" data-i="${i}" oninput="otpMove(this)" onkeydown="otpBack(event,this)">`).join('')}
        </div>
        <div id="otp-err" class="ferr" style="display:none;text-align:center;margin-bottom:10px"></div>
        <button class="btn btn-block btn-lg" style="background:${ecoColor};color:#fff;margin-top:8px" onclick="verifyOTP()">✅ Verifikasi</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="backToEco()">← Kembali</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.querySelector('.otp-box')?.focus(),100);
}

function otpMove(inp) { if(inp.value&&+inp.dataset.i<5) document.querySelectorAll('.otp-box')[+inp.dataset.i+1].focus(); }
function otpBack(e,inp) { if(e.key==='Backspace'&&!inp.value&&+inp.dataset.i>0) document.querySelectorAll('.otp-box')[+inp.dataset.i-1].focus(); }
function verifyOTP() {
  const code = Array.from(document.querySelectorAll('.otp-box')).map(i=>i.value).join('');
  if (code.length<6) { $('#otp-err').textContent='Masukkan 6 digit OTP'; $('#otp-err').style.display='block'; return; }
  if (code===_otpTmp.otp) {
    loginSuccess({..._otpTmp.user, username:_otpTmp.contact});
  } else {
    $('#otp-err').textContent='OTP salah. Coba lagi.'; $('#otp-err').style.display='block';
    document.querySelectorAll('.otp-box').forEach(i=>i.value='');
    document.querySelector('.otp-box')?.focus();
  }
}

function doLogin(type) {
  let user=null, errId='login-err';
  if (type==='campus') {
    const u=$('#cu')?.value.trim(), p=$('#cp')?.value;
    const d=CAMPUS_USERS[u];
    if (!d||d.pw!==p) { showLoginErr(errId,'❌ Username atau password salah'); return; }
    user={...d, username:u};
  } else if (type==='storage_admin') {
    const u=$('#sa-user')?.value.trim(), p=$('#sa-pw')?.value;
    errId='login-err2';
    const d=STORAGE_USERS[u];
    if (!d||d.pw!==p) { showLoginErr(errId,'❌ Username atau password salah. Akun ini tidak terdaftar di ekosistem Storage.'); return; }
    user={...d,username:u};
  } else if (type==='library_admin') {
    const u=$('#la-user')?.value.trim(), p=$('#la-pw')?.value;
    errId='login-err2';
    const d=LIBRARY_USERS[u];
    if (!d||d.pw!==p) { showLoginErr(errId,'❌ Username atau password salah. Akun tidak terdaftar di ekosistem Library.'); return; }
    user={...d,username:u};
  } else if (type==='owner') {
    const u=$('#ou')?.value.trim(), p=$('#op')?.value;
    const d=CAMPUS_USERS[u];
    if (!d||d.pw!==p||d.role!=='owner') { showLoginErr('login-err','❌ Username atau password Owner salah.'); return; }
    user={...d,username:u};
  }
  if (user) loginSuccess(user);
}

function showLoginErr(id, msg) {
  const el=$('#'+id); if(el){el.textContent=msg; el.style.display='block';}
}

function loginSuccess(user) {
  ST.user = user;
  ST.eco  = user.eco || 'campus';
  saveSession();
  setAccent(ST.eco);
  toast(`Selamat datang, ${user.name.split(' ')[0]}! 👋`,'Login berhasil','success');
  setTimeout(()=>renderApp(), 400);
}

function navTo(page) {
  _currentPage = page;
  $$('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  const titles = {
    dashboard:'Dashboard', 'campus-rooms':'Ruang Kuliah Unpak',
    'my-bookings':'Booking Saya', 'booking-approval':'Approval Booking',
    'campus-analytics':'Analytics Campus', 'room-mgmt':'Kelola Ruang',
    'storage-market':'Marketplace Gudang', 'storage-bookings':'Booking Storage',
    'storage-subscribe':'Berlangganan Admin', 'my-warehouses':'Gudang Saya', 'storage-revenue':'Revenue Storage',
    'library-rooms':'Ruang Library', 'library-bookings':'Booking Library',
    'library-approval':'Approval Library', 'library-mgmt':'Kelola Library',
    'owner-dash':'Owner Dashboard', 'all-tenants':'Semua Tenant',
    'all-tx':'Semua Transaksi', 'global-mon':'Global Monitoring',
    'iot-dash':'IoT Monitoring', 'reviews-pg':'Rating & Review',
    'notif-pg':'Notifikasi', profile:'Profil Saya'
  };
  $('#topbar-title').textContent = titles[page] || page;
  const el = $('#page-content');
  el.style.animation='none'; el.offsetHeight; el.style.animation='';
  const pages = {
    dashboard: pgDashboard, 'campus-rooms': pgCampusRooms,
    'my-bookings': pgMyBookings, 'booking-approval': pgApproval,
    'campus-analytics': pgCampusAnalytics, 'room-mgmt': pgRoomMgmt,
    'storage-market': pgStorageMarket, 'storage-bookings': pgStorageBookings,
    'storage-subscribe': pgStorageSubscribe, 'my-warehouses': pgMyWarehouses, 'storage-revenue': pgStorageRevenue,
    'library-rooms': pgLibraryRooms, 'library-bookings': pgLibraryBookings,
    'library-approval': pgLibApproval, 'library-mgmt': pgLibMgmt,
    'owner-dash': pgOwnerDash, 'all-tenants': pgAllTenants,
    'all-tx': pgAllTx, 'global-mon': pgGlobalMon,
    'iot-dash': pgIoT, 'reviews-pg': pgReviews,
    'notif-pg': pgNotifPage, profile: pgProfile
  };
  el.innerHTML = (pages[page]||pgDashboard)();
  // close sidebar on mobile
  if (window.innerWidth<=768){ $('#sidebar').classList.remove('open'); $('#sov').classList.remove('open'); }
  updateNotifBadge();

  // ── PAGE-SPECIFIC INITIALIZATION ──────────────────────────
  // Initialize timers for storage booking approval pages
  if (page==='storage-bookings' && ST.user?.role==='storage_admin') {
    setTimeout(() => {
      const myWHIds = getAllWH().filter(w=>w.admin===ST.user.username).map(w=>w.id);
      const pendingB = ST.storageBookings.filter(b=>myWHIds.includes(b.whId) && b.status==='pending_admin');
      pendingB.forEach(b => {
        startTimer(b.id, 1800, () => {
          const booking = ST.storageBookings.find(x => x.id === b.id);
          if (booking && booking.status === 'pending_admin') {
            booking.status = 'force_cancelled';
            booking.refunded = true;
            saveData();
            addNotif('storage', {
              type: 'booking',
              title: '❌ Force Cancel – Timeout',
              msg: `Booking ${booking.whName} auto-cancelled karena Anda tidak merespons dalam 30 menit. ${fmtRp(booking.total)} direfund ke ${getPayLbl(booking.payMethod)}.`,
              target: booking.userId
            });
            toast('Force Cancel!', `${booking.whName} · Tidak disetujui dalam 30 menit`, 'warning');
            navTo('storage-bookings');
          }
        });
      });
    }, 50);
  }
}

        <span class="sec-link" onclick="navTo('reviews-pg')">Review →</span>

  /* ── OWNER DASHBOARD (cross-ecosystem) ─────────────── */
  // Owner sees summarized cards for all 3 ecosystems, then redirects to owner-dash for full view

  return `
  <div class="page-hd">
    <div>

  </div>
  <div class="g3" style="gap:16px;margin-bottom:18px">
    ${[
      {eco:'campus', icon:'🏫', title:'Campus System', sub:`${avCampus}/${CAMPUS_ROOMS.length} ruang tersedia`, rev:'GRATIS', bk:ST.campusBookings.length, p:'campus-rooms', color:'var(--campus)', bg:'var(--campus-light)'},

    ].map(e=>`
      <div class="card" style="border-color:${e.color}20;cursor:pointer" onclick="navTo('${e.p}')">
        <div style="font-size:32px;margin-bottom:10px">${e.eco==='campus'?'🏫':e.eco==='storage'?'🏢':'📚'}</div>

  <div class="card">

    <div class="g4">
      ${[
        {i:'👑',l:'Owner Dashboard',p:'owner-dash'},{i:'🏫',l:'Campus Rooms',p:'campus-rooms'},

        {i:'🌐',l:'Monitoring',p:'global-mon'},{i:'🌡️',l:'IoT All',p:'iot-dash'}

function buildRoomCards(rooms, canBook, type) {
  const search = $('#cr-search')?.value||'';
  const fac = $('#cr-fac')?.value||'';
  const st = $('#cr-status')?.value||'';
  let list = rooms;
  if (fac) list=list.filter(r=>r.faculty===fac);
  if (st) list=list.filter(r=>r.status===st);
  if (search) list=list.filter(r=>[r.name,r.id,r.faculty||'',r.prog||'',r.bldg||''].join(' ').toLowerCase().includes(search.toLowerCase()));
  if (!list.length) return `<div class="empty" style="grid-column:1/-1"><div class="empty-ico">🔍</div><div class="empty-ttl">Tidak ada ruang ditemukan</div></div>`;
  return list.map(r=>{
    const s=statusBadge(r.status);
    const ok=canBook&&r.status==='available';
    return `<div class="room-card" onclick="openRoomDetail('${r.id}','${type}')">
      <div class="room-thumb">
        <span style="font-size:56px">${r.icon}</span>
        <div class="room-status-badge"><span class="badge ${s.cls}"><span class="s-dot ${s.dot}"></span> ${r.status==='in_use'?'In Use':r.status.charAt(0).toUpperCase()+r.status.slice(1).replace('_',' ')}</span></div>
      </div>
      <div class="room-body">
        <div class="room-name">${r.name}</div>
        <div class="room-meta">
          ${r.faculty?`<span>🏛️ ${r.faculty}</span>`:''}
          ${r.bldg?`<span>🏢 Lt.${r.floor??'G'}</span>`:`<span>📍 Lt.${r.floor}</span>`}
          <span>👥 ${r.cap}</span>
          <span>📐 ${r.area}m²</span>
        </div>
        <div class="room-chips">${r.fac.slice(0,3).map(f=>`<span class="chip">${f}</span>`).join('')}${r.fac.length>3?`<span class="chip">+${r.fac.length-3}</span>`:''}</div>
        <div class="room-foot">
          <div>${renderStars(Math.floor(r.rating))} <span style="font-size:11.5px;color:var(--text-muted)">${r.rating}</span></div>
          ${r.price!==undefined?`<span style="font-size:13px;font-weight:800;color:var(--accent)">${fmtRp(r.price)}/jam</span>`:`<span class="badge bg-green">🆓 Gratis</span>`}
        </div>
        ${ok?`<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="event.stopPropagation();openBookingForm('${r.id}','${type}')">📅 Booking</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function filterRooms() { $('#rooms-grid').innerHTML = buildRoomCards(CAMPUS_ROOMS, ['mahasiswa','ekskul','superadmin_campus','owner'].includes(ST.user?.role), 'campus'); }
function filterLibRooms() {
  const all = $('#lib-rooms-grid');
  if (!all) return;
  const type = $('#lib-type-sel')?.value||'';
  let rooms = LIB_ROOMS;
  if (type) rooms=rooms.filter(r=>r.type===type);
  const canBook = ['library_user','library_admin','owner'].includes(ST.user?.role);
  all.innerHTML = buildRoomCards(rooms, canBook, 'library');
}

/* ── 3D LAYOUT GENERATOR ────────────────────────────────── */
function gen3DLayout(room, type) {
  // Determine room category for layout variant
  const isLab   = room.id && /^M|^T/.test(room.id) && room.cap<=30;
  const isAula  = room.cap>=100;
  const isLib   = type==='library';
  const isMeet  = isLib && (room.type==='meeting'||room.type==='discussion');
  const isPriv  = isLib && room.type==='private';

  // 3D perspective SVG with isometric-style room
  const W=320, H=220;
  const floorColor  = ST.theme==='dark'?'#1e3a5f':'#dbeafe';
  const wallColorL  = ST.theme==='dark'?'#1a3350':'#bfdbfe';
  const wallColorR  = ST.theme==='dark'?'#163044':'#93c5fd';
  const wallColorB  = ST.theme==='dark'?'#172a40':'#60a5fa';
  const deskColor   = ST.theme==='dark'?'#2d4a6e':'#3b82f6';
  const chairColor  = ST.theme==='dark'?'#1e3a5f':'#93c5fd';
  const gridColor   = ST.theme==='dark'?'rgba(59,130,246,0.12)':'rgba(59,130,246,0.12)';

  // Isometric projection helpers
  const iso = (x,y,z,cx,cy)=>{
    const px = cx + (x-y)*Math.cos(Math.PI/6)*28;
    const py = cy + (x+y)*Math.sin(Math.PI/6)*28 - z*22;
    return {px,py};
  };

  // Build room box
  const cx=W/2, cy=H*0.55;
  const rw=4, rd=4, rh=3; // room grid units

  const corners = {
    fl: iso(0,0,0,cx,cy), fr: iso(rw,0,0,cx,cy),
    bl: iso(0,rd,0,cx,cy),br: iso(rw,rd,0,cx,cy),
    tlf:iso(0,0,rh,cx,cy),trf:iso(rw,0,rh,cx,cy),
    tlb:iso(0,rd,rh,cx,cy),trb:iso(rw,rd,rh,cx,cy)
  };
  const P=(p)=>`${p.px.toFixed(1)},${p.py.toFixed(1)}`;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;border-radius:10px;display:block">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
  </defs>
  <!-- BG -->
  <rect width="${W}" height="${H}" fill="${ST.theme==='dark'?'#0d1117':'#f0f9ff'}" rx="10"/>
  <!-- Floor -->
  <polygon points="${P(corners.fl)},${P(corners.fr)},${P(corners.br)},${P(corners.bl)}" fill="${floorColor}" stroke="#3b82f6" stroke-width="0.8" opacity="0.9"/>
  <!-- Floor grid -->
  ${[1,2,3].map(i=>{
    const a=iso(i,0,0,cx,cy),b=iso(i,rd,0,cx,cy);
    const c=iso(0,i,0,cx,cy),d=iso(rw,i,0,cx,cy);
    return `<line x1="${a.px}" y1="${a.py}" x2="${b.px}" y2="${b.py}" stroke="${gridColor}" stroke-width="1"/>
            <line x1="${c.px}" y1="${c.py}" x2="${d.px}" y2="${d.py}" stroke="${gridColor}" stroke-width="1"/>`;
  }).join('')}
  <!-- Left wall -->
  <polygon points="${P(corners.fl)},${P(corners.bl)},${P(corners.tlb)},${P(corners.tlf)}" fill="${wallColorL}" stroke="#3b82f6" stroke-width="0.8" opacity="0.85"/>
  <!-- Right wall -->
  <polygon points="${P(corners.fr)},${P(corners.br)},${P(corners.trb)},${P(corners.trf)}" fill="${wallColorR}" stroke="#3b82f6" stroke-width="0.8" opacity="0.85"/>
  <!-- Back wall left-->
  <polygon points="${P(corners.bl)},${P(corners.br)},${P(corners.trb)},${P(corners.tlb)}" fill="${wallColorB}" stroke="#3b82f6" stroke-width="0.8" opacity="0.75"/>
  <!-- Ceiling edge -->
  <polyline points="${P(corners.tlf)},${P(corners.trf)},${P(corners.trb)},${P(corners.tlb)},${P(corners.tlf)}" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>`;

  /* ── DOOR ── */
  const dp1=iso(0,1.6,0,cx,cy), dp2=iso(0,2.4,0,cx,cy);
  const dp3=iso(0,2.4,1.8,cx,cy), dp4=iso(0,1.6,1.8,cx,cy);
  svg+=`<polygon points="${P(dp1)},${P(dp2)},${P(dp3)},${P(dp4)}" fill="#93c5fd" opacity="0.6" stroke="#3b82f6" stroke-width="0.8"/>
        <text font-size="8" fill="#3b82f6" text-anchor="middle" x="${((dp1.px+dp2.px)/2).toFixed(0)}" y="${((dp3.py+dp4.py)/2+2).toFixed(0)}" opacity="0.7">🚪</text>`;

  /* ── WINDOW ── */
  const wp1=iso(3.5,rd,1.5,cx,cy), wp2=iso(2.5,rd,1.5,cx,cy);
  const wp3=iso(2.5,rd,2.5,cx,cy), wp4=iso(3.5,rd,2.5,cx,cy);
  svg+=`<polygon points="${P(wp1)},${P(wp2)},${P(wp3)},${P(wp4)}" fill="#bfdbfe" opacity="0.7" stroke="#3b82f6" stroke-width="0.8"/>`;

  /* ── SCREEN / BOARD front wall ── */
  if (!isPriv) {
    const sc1=iso(0.6,0,2.6,cx,cy), sc2=iso(3.4,0,2.6,cx,cy);
    const sc3=iso(3.4,0,1.9,cx,cy), sc4=iso(0.6,0,1.9,cx,cy);
    svg+=`<polygon points="${P(sc1)},${P(sc2)},${P(sc3)},${P(sc4)}" fill="${ST.theme==='dark'?'#1e3a5f':'#dbeafe'}" stroke="#3b82f6" stroke-width="1"/>
          <text font-size="7" fill="#3b82f6" text-anchor="middle" x="${((sc1.px+sc2.px)/2).toFixed(0)}" y="${((sc1.py+sc4.py)/2+2).toFixed(0)}" opacity="0.8">${isLab?'🖥️ Server':'📺 PROYEKTOR'}</text>`;
  }

  /* ── FURNITURE ── */
  if (isPriv) {
    // Private room: 1 desk with monitor
    const d=iso(1.5,2,0.4,cx,cy);
    const d2=iso(2.5,2,0.4,cx,cy), d3=iso(2.5,3,0.4,cx,cy), d4=iso(1.5,3,0.4,cx,cy);
    svg+=`<polygon points="${P(iso(1.5,2,0.4,cx,cy))},${P(iso(2.5,2,0.4,cx,cy))},${P(iso(2.5,3,0.4,cx,cy))},${P(iso(1.5,3,0.4,cx,cy))}" fill="${deskColor}" opacity="0.9" stroke="#1d4ed8" stroke-width="0.7"/>`;
    // Chair
    svg+=`<polygon points="${P(iso(1.7,3.2,0.35,cx,cy))},${P(iso(2.3,3.2,0.35,cx,cy))},${P(iso(2.3,3.6,0.35,cx,cy))},${P(iso(1.7,3.6,0.35,cx,cy))}" fill="${chairColor}" opacity="0.9" stroke="#1d4ed8" stroke-width="0.6"/>`;
    // Monitor
    const m=iso(2,2.3,0.8,cx,cy);
    svg+=`<text font-size="10" x="${m.px-4}" y="${m.py+2}">🖥️</text>`;
  } else if (isMeet) {
    // Meeting/discussion: oval table + chairs around
    const tc=iso(2,2.2,0.4,cx,cy);
    svg+=`<ellipse cx="${tc.px}" cy="${tc.py}" rx="28" ry="14" fill="${deskColor}" opacity="0.85" stroke="#1d4ed8" stroke-width="0.8"/>`;
    const chairs=room.cap||8;
    const cr=Math.min(chairs,10);
    for(let i=0;i<cr;i++){
      const a=(i/cr)*2*Math.PI;
      const cx2=tc.px+Math.cos(a)*35, cy2=tc.py+Math.sin(a)*18;
      svg+=`<ellipse cx="${cx2.toFixed(1)}" cy="${cy2.toFixed(1)}" rx="5" ry="3.5" fill="${chairColor}" opacity="0.9" stroke="#1d4ed8" stroke-width="0.5"/>`;
    }
  } else if (isLab) {
    // Lab: rows of individual desks with monitors
    const rows=3, cols=3;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const dx=0.5+c*1.1, dy=0.5+r*1.0;
      const p1=iso(dx,dy,0.35,cx,cy);
      svg+=`<polygon points="${P(iso(dx,dy,0.35,cx,cy))},${P(iso(dx+0.7,dy,0.35,cx,cy))},${P(iso(dx+0.7,dy+0.6,0.35,cx,cy))},${P(iso(dx,dy+0.6,0.35,cx,cy))}" fill="${deskColor}" opacity="0.85" stroke="#1d4ed8" stroke-width="0.5"/>`;

      svg+=`<text font-size="7" x="${mp.px-3}" y="${mp.py+2}">🖥</text>`;
    }
  } else if (isAula) {
    // Aula: stage + rows of chairs
    // Stage
    svg+=`<polygon points="${P(iso(0.4,0.3,0.1,cx,cy))},${P(iso(3.6,0.3,0.1,cx,cy))},${P(iso(3.6,1.2,0.1,cx,cy))},${P(iso(0.4,1.2,0.1,cx,cy))}" fill="${deskColor}" opacity="0.6" stroke="#1d4ed8" stroke-width="0.7"/>`;

    // Chairs in rows

  } else {
    // Regular classroom: teacher desk + student rows
    // Teacher desk
    svg+=`<polygon points="${P(iso(1.2,0.4,0.35,cx,cy))},${P(iso(2.8,0.4,0.35,cx,cy))},${P(iso(2.8,0.9,0.35,cx,cy))},${P(iso(1.2,0.9,0.35,cx,cy))}" fill="${deskColor}" opacity="0.95" stroke="#1d4ed8" stroke-width="0.7"/>`;
    // Student desks rows
    const rows=4, cols=5;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const dx=0.3+c*0.7, dy=1.2+r*0.65;
      svg+=`<polygon points="${P(iso(dx,dy,0.3,cx,cy))},${P(iso(dx+0.5,dy,0.3,cx,cy))},${P(iso(dx+0.5,dy+0.4,0.3,cx,cy))},${P(iso(dx,dy+0.4,0.3,cx,cy))}" fill="${deskColor}" opacity="0.8" stroke="#1d4ed8" stroke-width="0.4"/>`;
      const cp=iso(dx+0.25,dy+0.55,0.25,cx,cy);
      svg+=`<ellipse cx="${cp.px.toFixed(1)}" cy="${cp.py.toFixed(1)}" rx="4" ry="3" fill="${chairColor}" opacity="0.7"/>`;

  const ac=iso(3.5,0,2.7,cx,cy);
  svg+=`<text font-size="9" x="${ac.px-5}" y="${ac.py+2}" opacity="0.8">❄️</text>`;

  svg+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${ST.theme==='dark'?'#60a5fa':'#3b82f6'}" font-weight="700" opacity="0.8">Layout 3D – ${room.name}</text>`;
  svg+=`</svg>`;
  return svg;
}

let _selPay=null;
function buildPayMethods() {
  return [['qris','📱','QRIS'],['bca','🏦','BCA'],['bni','🏦','BNI VA'],['gopay','💚','GoPay'],['ovo','💜','OVO'],['dana','💙','DANA'],['shopeepay','🧡','ShopeePay'],['mandiri','🏦','Mandiri']].map(([id,ico,nm])=>
    `<div class="pay-card" id="pay-${id}" onclick="selPay('${id}')"><div class="pay-ico">${ico}</div><div class="pay-name">${nm}</div></div>`
  ).join('');
}
function selPay(id) { _selPay=id; $$('.pay-card').forEach(e=>e.classList.remove('sel')); $('#pay-'+id)?.classList.add('sel'); }
function calcBookPrice() {
  const r=_selectedRoom; if(!r?.price) return;
  const s=$('#bk-start')?.value, e=$('#bk-end')?.value;
  if (!s||!e) return;
  const h=calcHours(s,e);
  const total=h*r.price;
  const pEl=$('#bk-price'), dEl=$('#bk-price-detail');
  if(pEl) pEl.textContent=fmtRp(total);
  if(dEl) dEl.textContent=`${fmtRp(r.price)} × ${h} jam`;
}

function submitBooking(type) {
  const r=_selectedRoom;
  const date=$('#bk-date')?.value;
  const start=$('#bk-start')?.value;
  const end=$('#bk-end')?.value;
  const purpose=$('#bk-purpose')?.value?.trim();
  const errEl=$('#bk-err');
  const u=ST.user;
  const now=new Date();
  const isSelf=(type==='library'&&u.role==='library_admin');

  const err = (m) => { errEl.textContent=m; errEl.style.display='block'; };
  errEl.style.display='none';

  if (!date||!start||!end||!purpose) return err('Semua field wajib diisi.');
  if (end<=start) return err('Jam selesai harus lebih dari jam mulai.');

  // REAL-TIME VALIDATION: tanggal + jam tidak boleh sudah lewat
  const bookDt=new Date(`${date}T${start}`);
  const bookEndDt=new Date(`${date}T${end}`);
  if (bookDt<=now) return err(`⚠️ Booking gagal. Waktu mulai ${start} pada ${fmtDate(date)} sudah melewati waktu realtime (${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}).`);
  if (bookEndDt<=now) return err('⚠️ Waktu selesai sudah melewati waktu saat ini.');

  // Campus: hanya blokir jika in_use, maintenance, cleaning
  if (type==='campus') {
    if (r.status==='in_use') return err('⚠️ Ruang sedang In Use. Tidak bisa dibooking saat ini.');
    if (r.status==='maintenance') return err('⚠️ Ruang sedang Maintenance. Tidak bisa dibooking.');
    if (r.status==='cleaning') return err('⚠️ Ruang sedang Cleaning. Tidak bisa dibooking.');
  }
  if (type==='library') {
    if (r.status==='cleaning') return err('⚠️ Ruang sedang Cleaning, tidak bisa dibooking.');
    if (r.status==='maintenance') return err('⚠️ Ruang sedang Maintenance, tidak bisa dibooking.');
    if (!isSelf&&!_selPay) return err('Pilih metode pembayaran.');
  }

  // Overlap check (both campus & library)
  const bArr = type==='campus'?ST.campusBookings:ST.libraryBookings;
  const overlap = bArr.some(b=>
    b.roomId===r.id && b.date===date &&
    !['cancelled','rejected','expired'].includes(b.status) &&
    !(end<=b.startTime || start>=b.endTime)
  );
  if (overlap) return err(`⚠️ Slot ${start}–${end} pada ${fmtDate(date)} sudah dibooking. Pilih jam yang lain.`);

  const count=parseInt($('#bk-count')?.value||1);
  if (type==='campus'&&count>r.cap) return err(`Peserta melebihi kapasitas (maks ${r.cap}).`);

  const h=type==='library'?calcHours(start,end):0;
  const total=isSelf?0:(type==='library'?h*r.price:0);

  const booking = {
    id:genId(), roomId:r.id, roomName:r.name, faculty:r.faculty||null,
    userId:u.username, userName:u.name,
    date, startTime:start, endTime:end, purpose,
    count: type==='campus'?count:null,
    hours: type==='library'?h:null,
    total, payMethod:isSelf?'gratis':(_selPay||null),
    status: (type==='campus'?'pending': isSelf?'confirmed':'pending'),
    createdAt:new Date().toISOString()
  };

  if (type==='campus') {
    ST.campusBookings.unshift(booking);
    // Set room status to booked if available
    if (r.status==='available') r.status='booked';
    addNotif('campus',{type:'booking',title:`Booking Baru – ${r.name}`,msg:`${u.name} mengajukan booking ${r.name} pada ${fmtDate(date)} ${start}–${end}`,faculty:r.faculty,target:'admin_'+r.faculty?.toLowerCase()});
    // auto-cancel after 10 mins if not approved
    startTimer(booking.id, 600, ()=>{
      const b=ST.campusBookings.find(x=>x.id===booking.id);
      if(b&&b.status==='pending'){ b.status='expired'; saveData(); toast('Booking Kedaluwarsa','Booking otomatis dibatalkan karena tidak diapprove dalam 10 menit','warning'); }
    });
  } else {
    ST.libraryBookings.unshift(booking);
    if (!isSelf) {
      addNotif('library',{type:'booking',title:`Booking Library – ${r.name}`,msg:`${u.name} mengajukan booking ${r.name} pada ${fmtDate(date)} ${start}–${end}`,target:'lib_admin'});
      startTimer(booking.id,300,()=>{
        const b=ST.libraryBookings.find(x=>x.id===booking.id);
        if(b&&b.status==='pending'){ b.status='expired'; saveData(); toast('Booking Dibatalkan','Tidak diapprove admin dalam 5 menit – otomatis dibatalkan','warning'); }
      });
    }
  }
  saveData(); closeModal('campus-book-modal'); _selPay=null;
  toast(booking.status==='confirmed'?'Booking Dikonfirmasi!':'Booking Diajukan!',
    booking.status==='confirmed'?`${r.name} – auto confirmed`:`Menunggu approval admin · ${fmtDate(date)} ${start}–${end}`,'success');
  navTo(type==='campus'?'my-bookings':'library-bookings');
}

/* ── QR MODAL ──────────────────────────────────────────── */
function qrModal() {
  return `<div class="modal-overlay" id="qr-modal"><div class="modal-box" style="max-width:360px"><div class="modal-hd"><span class="modal-title">📱 QR Check-in</span><button class="modal-close">✕</button></div><div class="modal-body" id="qr-body" style="text-align:center"></div></div></div>`;
}
function showQR(bookingId) {
  const b=ST.campusBookings.find(x=>x.id===bookingId);
  if(!b)return;
  const now=new Date(), bs=new Date(`${b.date}T${b.startTime}`);
  const canScan=now>=new Date(bs.getTime()-18e5)&&now<=new Date(bs.getTime()+6e5);
  $('#qr-body').innerHTML=`
    <div style="margin-bottom:14px"><div style="font-size:13px;font-weight:700">${b.roomName}</div><div style="font-size:12px;color:var(--text-muted)">${fmtDate(b.date)} · ${b.startTime}–${b.endTime}</div></div>
    <div class="qr-wrap" id="qr-svg"></div>
    <div style="font-size:11px;font-family:monospace;color:var(--text-muted);margin:10px 0;letter-spacing:2px">${b.id}</div>
    ${canScan?`<div class="badge bg-green" style="margin-bottom:12px">✅ Dalam waktu scan</div>`:`<div class="badge bg-orange" style="margin-bottom:12px">⚠️ Di luar waktu scan</div>`}
    <button class="btn btn-success btn-block" onclick="doScan('${bookingId}')">📷 ${canScan?'Scan QR':'Demo Scan'}</button>`;
  openModal('qr-modal');
  setTimeout(()=>drawQR('qr-svg',bookingId),80);
}
function drawQR(elId, text) {
  const el=document.getElementById(elId); if(!el)return;
  let seed=0; for(let i=0;i<text.length;i++) seed+=text.charCodeAt(i)*(i+1);
  const rand=()=>{ seed=(seed*1664525+1013904223)&0xffffffff; return Math.abs(seed)%2; };
  const n=15, cs=9;
  let s=`<svg width="${n*cs}" height="${n*cs}" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/>`;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const fp=(r<3&&c<3)||(r<3&&c>=n-3)||(r>=n-3&&c<3);
    const dark=fp?((r===0||r===2||c===0||c===2)||(r===1&&c===1)):rand()===0;
    if(dark) s+=`<rect x="${c*cs}" y="${r*cs}" width="${cs}" height="${cs}" fill="#000"/>`;
  }
  el.innerHTML=s+'</svg>';
}
function doScan(id) {
  const b=ST.campusBookings.find(x=>x.id===id); if(!b)return;
  b.qrScanned=true; b.status='in_use';
  const r=CAMPUS_ROOMS.find(r=>r.id===b.roomId); if(r) r.status='in_use';
  saveData(); closeModal('qr-modal'); toast('Check-in Berhasil!',`${b.roomName} sekarang In Use`,'success'); navTo('my-bookings');
}

/* ── BOOKING APPROVAL ──────────────────────────────────── */
function pgApproval() {
  const u=ST.user;
  let pending=ST.campusBookings.filter(b=>b.status==='pending');
  if (u.role==='admin_faculty') pending=pending.filter(b=>b.faculty===u.faculty);
  return `
  <div class="page-hd"><div><div class="page-title">✅ Approval Booking</div><div class="page-sub">${u.role==='admin_faculty'?`Fakultas ${u.faculty}`:'Semua Fakultas'} · ${pending.length} pending</div></div></div>
  ${!pending.length?`<div class="empty"><div class="empty-ico">✅</div><div class="empty-ttl">Tidak ada booking pending</div></div>`:`
  <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Pemohon</th><th>Ruang</th><th>Tanggal & Waktu</th><th>Peserta</th><th>Keperluan</th><th>Aksi</th></tr></thead>
    <tbody>${pending.map(b=>`<tr>
      <td><b>${b.userName}</b><br><span style="font-size:11px;color:var(--text-muted)">${b.userId}</span></td>
      <td><b>${b.roomName}</b><br><span style="font-size:11px;color:var(--text-muted)">${b.faculty||''}</span></td>
      <td style="white-space:nowrap">${fmtDate(b.date)}<br><span style="font-size:11px">${b.startTime}–${b.endTime}</span></td>
      <td>${b.count||'-'}</td>
      <td><span style="display:block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.purpose}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-success btn-sm" onclick="approveB('${b.id}')">✓ Approve</button>
        <button class="btn btn-danger btn-sm" onclick="rejectB('${b.id}')">✕ Tolak</button>
      </td>
    </tr>`).join('')}</tbody>
  </table></div></div>`}`;
}
function approveB(id) {
  const b=ST.campusBookings.find(x=>x.id===id);
  const u=ST.user;
  if (!b)return;
  if (u.role==='admin_faculty'&&b.faculty!==u.faculty){toast('Akses Ditolak','Anda hanya bisa approve booking fakultas sendiri.','error');return;}
  b.status='approved'; b.approvedBy=u.name;
  const r=CAMPUS_ROOMS.find(r=>r.id===b.roomId); if(r&&r.status==='available') r.status='booked';
  addNotif('campus',{type:'booking',title:'✅ Booking Disetujui',msg:`Booking ${b.roomName} disetujui. Segera scan QR sebelum waktu mulai!`,target:b.userId});
  saveData(); toast('Booking Disetujui',b.roomName,'success'); navTo('booking-approval');
}
function rejectB(id) {
  confirmDlg('Tolak Booking?','Booking akan ditolak dan pemohon diberitahu.',()=>{
    const b=ST.campusBookings.find(x=>x.id===id);
    if(b){ b.status='rejected'; addNotif('campus',{type:'booking',title:'❌ Booking Ditolak',msg:`Booking ${b.roomName} ditolak admin.`,target:b.userId}); saveData(); toast('Ditolak','','info'); navTo('booking-approval'); }
  },'danger');
}

  r.status=st; saveData(); toast('Status Diperbarui',`${r.name} → ${st}`,'success');
}

/* ── 3D WAREHOUSE LAYOUT ─────────────────────────────── */
function gen3DWarehouseLayout(w) {
  const W=320, H=220, dk=ST.theme==='dark';
  const floor=dk?'#2d1f00':'#fef3c7', wL=dk?'#3d2800':'#fde68a',
        wR=dk?'#4a3000':'#fcd34d', wB=dk?'#553800':'#f59e0b',
        shelf=dk?'#6b4a00':'#d97706', pallet=dk?'#7c5500':'#92400e';
  const cx=W/2, cy=H*0.58;
  const iso=(x,y,z)=>({ px:cx+(x-y)*Math.cos(Math.PI/6)*24, py:cy+(x+y)*Math.sin(Math.PI/6)*24-z*18 });
  const P=p=>`${p.px.toFixed(1)},${p.py.toFixed(1)}`;
  const rw=5, rd=5, rh=Math.min(4.5, Math.max(2.2, w.height/3));
  const c={fl:iso(0,0,0),fr:iso(rw,0,0),bl:iso(0,rd,0),br:iso(rw,rd,0),
           tlf:iso(0,0,rh),trf:iso(rw,0,rh),tlb:iso(0,rd,rh),trb:iso(rw,rd,rh)};
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;border-radius:10px;display:block">
  <rect width="${W}" height="${H}" fill="${dk?'#0d1117':'#fffbeb'}" rx="10"/>
  <polygon points="${P(c.fl)},${P(c.fr)},${P(c.br)},${P(c.bl)}" fill="${floor}" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon points="${P(c.fl)},${P(c.bl)},${P(c.tlb)},${P(c.tlf)}" fill="${wL}" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon points="${P(c.fr)},${P(c.br)},${P(c.trb)},${P(c.trf)}" fill="${wR}" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon points="${P(c.bl)},${P(c.br)},${P(c.trb)},${P(c.tlb)}" fill="${wB}" stroke="#f59e0b" stroke-width="0.8" opacity="0.75"/>
  <polyline points="${P(c.tlf)},${P(c.trf)},${P(c.trb)},${P(c.tlb)},${P(c.tlf)}" fill="none" stroke="#f59e0b" stroke-width="1.1" opacity="0.5"/>`;
  // loading dock
  const d1=iso(0,2,0),d2=iso(0,3,0),d3=iso(0,3,1.8),d4=iso(0,2,1.8);
  s+=`<polygon points="${P(d1)},${P(d2)},${P(d3)},${P(d4)}" fill="#fcd34d" opacity="0.5" stroke="#f59e0b" stroke-width="0.8"/>`;
  const dk2=iso(0,2.5,0.9); s+=`<text font-size="10" x="${(dk2.px-5).toFixed(0)}" y="${(dk2.py+3).toFixed(0)}" opacity="0.8">🚛</text>`;
  // shelves
  [[0.4,0.4],[0.4,2.1],[0.4,3.7],[2.6,0.4],[2.6,2.1],[2.6,3.7]].forEach(([x,y])=>{
    for(let lv=0;lv<Math.min(3,Math.floor(rh));lv++){
      const sh=0.45+lv*0.72;
      s+=`<polygon points="${P(iso(x,y,sh))},${P(iso(x+1.5,y,sh))},${P(iso(x+1.5,y+0.5,sh))},${P(iso(x,y+0.5,sh))}" fill="${shelf}" opacity="0.8" stroke="#92400e" stroke-width="0.5"/>`;
      if(lv<2){const pp=iso(x+0.5,y+0.1,sh+0.15); s+=`<rect x="${(pp.px-5).toFixed(0)}" y="${(pp.py-3).toFixed(0)}" width="10" height="7" rx="1" fill="${pallet}" opacity="0.85"/>`;}
    }
  });
  if(w.fac?.includes('Forklift Access')){const fp=iso(2.2,1.8,0.1);s+=`<text font-size="12" x="${(fp.px-6).toFixed(0)}" y="${(fp.py+4).toFixed(0)}" opacity="0.8">🏗️</text>`;}
  if(w.type==='cold'){const cp=iso(4.3,4.2,rh*0.6);s+=`<text font-size="14" x="${(cp.px-7).toFixed(0)}" y="${(cp.py+4).toFixed(0)}" opacity="0.9">❄️</text>`;}
  const lp=iso(2.5,2.5,rh),cc=iso(4.5,0.3,rh);
  s+=`<text font-size="11" x="${(lp.px-6).toFixed(0)}" y="${(lp.py+4).toFixed(0)}" opacity="0.7">💡</text>`;
  s+=`<text font-size="9" x="${(cc.px-5).toFixed(0)}" y="${(cc.py+3).toFixed(0)}" opacity="0.7">📹</text>`;
  s+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${dk?'#fcd34d':'#92400e'}" font-weight="700" opacity="0.8">Layout 3D – ${w.name?.substring(0,26)||'Gudang'}</text>`;
  return s+'</svg>';
}

function buildWHCards() {
  const s=$('#wh-s')?.value||'', t=$('#wh-type')?.value||'', c=$('#wh-city')?.value||'';
  let list=getAllWH();
  if(t) list=list.filter(w=>w.type===t);
  if(c) list=list.filter(w=>w.city===c);
  if(s) list=list.filter(w=>[w.name,w.city,w.type,w.desc].join(' ').toLowerCase().includes(s.toLowerCase()));
  if(!list.length) return `<div class="empty" style="grid-column:1/-1"><div class="empty-ico">🔍</div><div class="empty-ttl">Gudang tidak ditemukan</div></div>`;
  return list.map(w=>{
    const bookedRanges=getBookedRanges(w.id);
    const isFullBooked=bookedRanges.length>0&&bookedRanges.some(r=>r.start<=today()&&r.end>today());
    return `<div class="room-card" onclick="openWHDetail('${w.id}')">
      <div class="room-thumb" style="background:linear-gradient(135deg,var(--storage-light),var(--storage-border));position:relative">
        <span style="font-size:62px">${w.icon||'🏭'}</span>
        ${isFullBooked?`<div style="position:absolute;top:10px;left:10px"><span class="badge bg-red">● Tersewa Sekarang</span></div>`:'<div style="position:absolute;top:10px;left:10px"><span class="badge bg-green">● Tersedia</span></div>'}
      </div>
      <div class="room-body">
        <div class="room-name">${w.name}</div>
        <div class="room-meta"><span>📍 ${w.city}</span><span>📐 ${w.area}m²</span><span>📦 ${w.pallet||'-'} pallet</span><span>📏 Tinggi ${w.height}m</span></div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${w.desc}</div>
        <div class="room-chips">${(w.fac||[]).slice(0,3).map(f=>`<span class="chip">${f}</span>`).join('')}${(w.fac||[]).length>3?`<span class="chip">+${(w.fac||[]).length-3}</span>`:''}</div>
        <div class="room-foot">
          <div>${renderStars(Math.floor(w.rating||4))} <span style="font-size:11.5px;color:var(--text-muted)">${w.rating||4.0}</span></div>
          <div style="text-align:right"><div style="font-size:14px;font-weight:800;color:var(--storage)">${fmtRp(w.price)}</div><div style="font-size:10px;color:var(--text-muted)">/hari</div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function buildStorPay() {
  return [['qris','📱','QRIS'],['bca','🏦','BCA'],['bni','🏦','BNI VA'],['gopay','💚','GoPay'],['ovo','💜','OVO'],['dana','💙','DANA'],['shopeepay','🧡','ShopeePay'],['mandiri','🏦','Mandiri']].map(([id,ico,nm])=>
    `<div class="pay-card" id="sbp-${id}"><div class="pay-ico">${ico}</div><div class="pay-name">${nm}</div></div>`
  ).join('');
}

function calcSP() {
  const s=$('#st-s')?.value, e=$('#st-e')?.value;
  if(!s||!e||!_selectedRoom){ return; }
  if(e<s){ if($('#st-err')){ $('#st-err').textContent='Tanggal selesai harus setelah mulai'; $('#st-err').style.display='block'; } return; }
  $('#st-err').style.display='none';
  const days=calcDays(s,e), total=_selectedRoom.price*days;
  if($('#st-price')) $('#st-price').textContent=fmtRp(total);
  if($('#st-detail')) $('#st-detail').textContent=`${fmtRp(_selectedRoom.price)} × ${days} hari = ${fmtRp(total)}`;
  // Check availability
  const info=$('#st-avail-info');
  if(info){
    if(whDateOverlap(_selectedRoom.id,s,e)){
      info.innerHTML=`<span style="color:var(--red)">⛔ Rentang tanggal ini bertabrakan dengan penyewa lain. Pilih tanggal lain.</span>`;
    } else {
      info.innerHTML=`<span style="color:var(--green)">✅ Tanggal ${fmtDate(s)} – ${fmtDate(e)} tersedia!</span>`;
    }
  }
}

function submitStorBook() {
  const w=_selectedRoom, u=ST.user, isSelf=u.role==='storage_admin'&&w.admin===u.username;
  const start=$('#st-s')?.value, end=$('#st-e')?.value, purpose=$('#st-purpose')?.value?.trim();
  const errEl=$('#st-err');
  const err=m=>{errEl.textContent=m; errEl.style.display='block';};
  errEl.style.display='none';
  if(!start||!end) return err('Tanggal wajib diisi.');
  if(end<start) return err('Tanggal selesai harus setelah tanggal mulai.');
  // Real-time: tanggal mulai tidak boleh sebelum hari ini
  if(start<today()) return err(`⚠️ Tanggal mulai ${fmtDate(start)} sudah lewat hari ini (${fmtDate(today())}).`);
  if(!isSelf&&!_selPay) return err('Pilih metode pembayaran.');
  // Date overlap check
  if(whDateOverlap(w.id, start, end)) return err(`⛔ Tanggal ${fmtDate(start)}–${fmtDate(end)} bertabrakan dengan penyewa lain. Pilih tanggal lain.`);

  const days=calcDays(start,end), total=isSelf?0:days*w.price;
  const booking={
    id:genId(), whId:w.id, whName:w.name, whAdmin:w.admin||'storage_admin1',
    userId:u.username, userName:u.name,
    startDate:start, endDate:end, days, total,
    payMethod:isSelf?'gratis':_selPay, purpose:purpose||'-',
    status:isSelf?'confirmed':'pending_admin',
    refunded:false, createdAt:new Date().toISOString()
  };
  ST.storageBookings.unshift(booking);
  saveData(); closeModal('stor-book-modal'); _selPay=null;

  if(isSelf){
    toast('Booking Dikonfirmasi!',`${w.name} · ${days} hari · GRATIS`,'success');
  } else {
    addNotif('storage',{
      type:'booking_req',
      title:`⏳ Permintaan Sewa – ${w.name}`,
      msg:`${u.name} ingin menyewa ${w.name} (${fmtDate(start)}–${fmtDate(end)}, ${days} hari, ${fmtRp(total)}). Setujui dalam 30 menit.`,
      target:w.admin||'storage_admin1'
    });
    // 30-minute auto force-cancel
    startTimer(booking.id, 1800, ()=>{
      const b=ST.storageBookings.find(x=>x.id===booking.id);
      if(b&&b.status==='pending_admin'){
        b.status='force_cancelled'; b.refunded=true;
        saveData();
        toast('Force Cancel!',`Pemilik tidak merespons 30 menit. ${fmtRp(total)} direfund ke ${getPayLbl(b.payMethod)}.`,'warning');
      }
    });
    toast('Pengajuan Terkirim!',`Menunggu persetujuan pemilik gudang (maks 30 menit) · ${fmtRp(total)}`,'info');
  }
  navTo('storage-bookings');
}

/* ── USER BOOKING HISTORY + ADMIN APPROVE ───────────── */

    </div>
    ${pendingB.map(b=>`
      <div style="padding:14px;background:rgba(249,115,22,.05);border:1px solid rgba(249,115,22,.2);border-radius:var(--radius-sm);margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">

            <div class="countdown" style="margin-top:8px">⏱ Sisa waktu: <span data-timer="${b.id}" style="font-weight:800">30:00</span></div>

function approveStorBook(id) {
  const b = ST.storageBookings.find(x=>x.id===id); if(!b) return;
  if (b.status !== 'pending_admin') {
    toast('Tidak Bisa', 'Booking sudah tidak dalam status menunggu admin.', 'warning');
    return;
  }
  confirmDlg('Setujui Booking?', `Apakah Anda yakin ingin menyetujui booking ${b.whName} untuk ${b.userName}?`, ()=>{
    b.status='confirmed';
    addNotif('storage',{type:'booking',title:'✅ Sewa Gudang Disetujui!',msg:`Booking ${b.whName} (${fmtDate(b.startDate)}–${fmtDate(b.endDate)}) disetujui pemilik gudang. Selamat!`,target:b.userId});
    saveData(); toast('Booking Disetujui',`${b.whName} · ${b.userName}`,'success'); navTo('storage-bookings');
  }, 'success');
}
function rejectStorBook(id) {
  const b = ST.storageBookings.find(x=>x.id===id); if(!b) return;
  if (b.status !== 'pending_admin') {
    toast('Tidak Bisa', 'Booking sudah tidak dalam status menunggu admin.', 'warning');
    return;
  }
  confirmDlg('Tolak Booking & Refund?', `Biaya akan direfund otomatis ke metode pembayaran user.`,()=>{
    b.status='rejected'; b.refunded=true;
    addNotif('storage',{type:'booking',title:'❌ Sewa Ditolak – Refund',msg:`Booking ${b.whName} ditolak pemilik. ${fmtRp(b.total)} direfund ke ${getPayLbl(b.payMethod)}.`,target:b.userId});
    saveData(); toast('Booking Ditolak',fmtRp(b.total),'info'); navTo('storage-bookings');
  },'danger');
}
function cancelStorUser(id) {
  confirmDlg('Batalkan Booking?','Booking dibatalkan dan biaya direfund.',()=>{
    const b=ST.storageBookings.find(x=>x.id===id); if(!b) return;
    b.status='cancelled'; b.refunded=true;
    saveData(); toast('Dibatalkan','Biaya direfund ke '+getPayLbl(b.payMethod),'info'); navTo('storage-bookings');
  },'danger');
}

/* ── REVENUE ─────────────────────────────────────────── */
function pgStorageRevenue() {
  const u=ST.user, myWIDs=getAllWH().filter(w=>w.admin===u.username).map(w=>w.id);
  const confirmed=ST.storageBookings.filter(b=>myWIDs.includes(b.whId)&&b.status==='confirmed');
  const total=confirmed.reduce((s,b)=>s+b.total,0);
  const pending=ST.storageBookings.filter(b=>myWIDs.includes(b.whId)&&b.status==='pending_admin');
  const month=confirmed.filter(b=>new Date(b.createdAt)>new Date(Date.now()-30*864e5)).reduce((s,b)=>s+b.total,0);
  return `
  <div class="page-hd"><div class="page-title">💰 Revenue Storage</div></div>
  <div class="stats-grid">
    ${[{l:'Total Revenue',v:fmtRp(total),i:'💰'},{l:'Booking Confirmed',v:confirmed.length,i:'✅'},{l:'Revenue Bulan Ini',v:fmtRp(month),i:'📅'},{l:'Pending Approval',v:pending.length,i:'⏳'}].map(s=>`<div class="stat-card" style="--accent:var(--storage)"><div class="stat-lbl">${s.l}</div><div class="stat-val" style="font-size:${s.v.toString().length>8?'17px':'24px'}">${s.v}</div><div class="stat-ico">${s.i}</div></div>`).join('')}
  </div>
  ${confirmed.length?`<div class="card"><div class="sec-title" style="margin-bottom:14px">📊 Rincian Revenue</div><div class="tbl-wrap"><table>
    <thead><tr><th>Penyewa</th><th>Gudang</th><th>Periode</th><th>Hari</th><th>Revenue</th><th>Pembayaran</th></tr></thead>
    <tbody>${confirmed.map(b=>`<tr>
      <td><b>${b.userName}</b></td><td>${b.whName}</td>
      <td style="white-space:nowrap">${fmtDate(b.startDate)}–${fmtDate(b.endDate)}</td>
      <td>${b.days} hari</td>
      <td><b style="color:var(--storage)">${fmtRp(b.total)}</b></td>
      <td>${getPayLbl(b.payMethod)}</td>
    </tr>`).join('')}</tbody>
  </table></div></div>`:`<div class="empty"><div class="empty-ico">💰</div><div class="empty-ttl">Belum ada revenue</div></div>`}`;
}

function calcSubFee(){
  const a=parseFloat($('#calc-area')?.value)||0, h=parseFloat($('#calc-height')?.value)||0;

  r.textContent = (a&&h) ? `💰 Estimasi biaya: ${fmtRp(calcSubPrice(a,h))}/bulan` : '';
}

function validateSubArea(maxArea, maxHeight) {
  const a=parseFloat($('#sf-area')?.value)||0, h=parseFloat($('#sf-height')?.value)||0;
  const w=$('#sf-area-warn'); if(!w) return;
  if (a>maxArea) { w.textContent=`⚠️ Luas melebihi batas plan (maks ${maxArea}m²)`; w.style.display='block'; }
  else if (h>maxHeight) { w.textContent=`⚠️ Tinggi melebihi batas plan (maks ${maxHeight}m)`; w.style.display='block'; }
  else w.style.display='none';
}

function selSubPay(id) {
  _subSelPay=id;
  $$('#sf-pay .pay-card').forEach(e=>e.classList.remove('sel'));
  $('#sfp-'+id)?.classList.add('sel');
}

function submitSub() {
  const u=ST.user;
  if (!ST.subscriptions) ST.subscriptions=[];
  if (!ST.userWarehouses) ST.userWarehouses=[];

  // Collect form data
  const name    = $('#sf-name')?.value?.trim();
  const type    = $('#sf-type')?.value;
  const price   = parseFloat($('#sf-price')?.value)||0;
  const area    = parseFloat($('#sf-area')?.value)||0;
  const height  = parseFloat($('#sf-height')?.value)||0;
  const pallet  = parseInt($('#sf-pallet')?.value)||0;
  const addr    = $('#sf-addr')?.value?.trim();
  const city    = $('#sf-city')?.value?.trim();
  const postal  = $('#sf-postal')?.value?.trim()||'';
  const prov    = $('#sf-prov')?.value?.trim()||'Jawa Barat';
  const desc    = $('#sf-desc')?.value?.trim();
  const fac     = Array.from($$('#sf-fac input:checked')).map(c=>c.value);

  const errEl = $('#sf-err');
  const err = m => { if(errEl){errEl.textContent=m; errEl.style.display='block';} };
  if (errEl) errEl.style.display='none';

  // Validation
  if (!name)   return err('❌ Nama gudang wajib diisi.');
  if (!type)   return err('❌ Tipe gudang wajib dipilih.');
  if (!price||price<50000) return err('❌ Harga sewa minimal Rp 50.000/hari.');
  if (!area||area<=0)      return err('❌ Luas gudang wajib diisi.');
  if (!height||height<=0)  return err('❌ Tinggi gudang wajib diisi.');
  if (area > (_subPlan.maxArea||99999))   return err(`❌ Luas melebihi batas plan ${_subPlan.title} (maks ${_subPlan.maxArea}m²).`);
  if (height > (_subPlan.maxHeight||99))  return err(`❌ Tinggi melebihi batas plan (maks ${_subPlan.maxHeight}m).`);
  if (!pallet) return err('❌ Kapasitas pallet wajib diisi.');
  if (!addr)   return err('❌ Alamat lengkap wajib diisi.');
  if (!city)   return err('❌ Kota wajib diisi.');
  if (!desc)   return err('❌ Deskripsi gudang wajib diisi.');
  if (!_subSelPay) return err('❌ Pilih metode pembayaran berlangganan.');

  // Check plan quota
  const myActiveSubs = ST.subscriptions.filter(s=>s.userId===u.username&&s.status==='active');
  if (myActiveSubs.length >= (_subPlan.whMax||1)) return err(`❌ Plan ${_subPlan.title} hanya untuk ${_subPlan.whMax} gudang. Upgrade plan untuk menambah lebih banyak.`);

  // ── Generate Admin Credentials ──────────────────────────
  // Use phone as base username, generate a strong password
  const baseContact = u.phone || u.email || u.username;
  const adminUsername = 'admin_' + baseContact.replace(/[^a-z0-9]/gi,'').substring(0,10).toLowerCase();
  const adminPassword = 'Stor@' + Math.random().toString(36).substring(2,8).toUpperCase();

  // Create pending warehouse data for approval
  const iconMap = {retail:'🏭',cold:'❄️',industrial:'🏗️',logistic:'🚛',ruko:'🏪',furniture:'🪑'};
  const whId = 'UWH'+genId();
  const pendingWarehouse = {
    id:whId, name, admin:adminUsername, type,
    city, prov, addr, postal,
    area, height, pallet, price, desc, fac,
    icon: iconMap[type]||'🏭',
    rating:4.0, rev:0,
    createdAt: new Date().toISOString()
  };

  // Create subscription record in pending state
  const sub = {
    id: genId(), userId:u.username, userName:u.name,
    plan: _subPlan.plan, title: _subPlan.title,
    whId, whName: name,
    monthly: _subPlan.monthly,
    payMethod: _subSelPay,
    status: 'pending',
    adminUsername, adminPassword,
    pendingWarehouse,
    createdAt: new Date().toISOString()
  };
  ST.subscriptions.push(sub);
  ST.user.adminUsername = adminUsername;
  ST.user.adminPassword = adminPassword;

  // ── CREATE SEPARATE ADMIN CREDENTIALS (NO AUTO-UPGRADE) ──
  STORAGE_USERS[adminUsername] = {
    pw:    adminPassword,
    role:  'storage_admin',
    name:  u.name + ' (Owner)',
    avatar:'🏢',
    eco:   'storage',
    phone: u.phone||'',
    originalContact: u.username,
    adminUsername, adminPassword
  };
  if (!ST.storageUsers) ST.storageUsers = {};
  ST.storageUsers[adminUsername] = {...STORAGE_USERS[adminUsername]};

  // Update OTP backup (if exists) but do not modify current session
  const contact = u.username;
  if (STORAGE_OTP[contact]) {
    STORAGE_OTP[contact].adminUsername  = adminUsername;
    STORAGE_OTP[contact].adminPassword  = adminPassword;
  }

  saveStorageExtra(); saveData();
  saveSession();

  addNotif('storage', {
    type:'subscription',
    title:`⭐ Permintaan Storage Admin Baru – ${u.name}`,
    msg:`${u.name} mengajukan langganan Plan ${_subPlan.title} untuk gudang "${name}" (${area}m²×${height}m, ${city}). Akun admin dibuat dan menunggu aktivasi.`,
    target:'spaceflow'
  });
  addNotif('storage', {
    type:'subscription',
    title:'🟡 Permintaan Pendaftaran Gudang Dikirim',
    msg:`Gudang ${name} sedang menunggu aktivasi. Username admin Anda: ${adminUsername}.`,
    target:u.username
  });
  toast('Permintaan Dikirim', `Permintaan langganan untuk gudang ${name} telah dikirim dan menunggu aktivasi.`, 'success');

  closeModal('sub-form-modal');
  // Show credentials modal so user can copy data for later login
  showAdminCredentials(adminUsername, adminPassword, name, _subPlan.monthly, _subSelPay, 'pending');
  _subSelPay=null;
}
