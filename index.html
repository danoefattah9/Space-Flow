function copyText(text, label) {
  navigator.clipboard?.writeText(text).then(()=>{
    toast(`${label} disalin!`,'','success');
  }).catch(()=>{
    // Fallback: select text
    toast(`${label}: ${text}`,'Salin manual dari sini','info');
  });
}

function closeCredModal() {
  const el = document.getElementById('cred-modal');
  if (el) {
    el.style.animation = 'none';
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(()=>el.remove(), 300);
  }
  // Close only. The account created is separate — user must login
  // using the admin credentials via Storage Login (Admin tab).
  toast('Kredensial dibuat', 'Silakan login terpisah di Storage → Admin menggunakan username & password yang ditampilkan.', 'info');
}

function openAdminLoginPrefill(username, password) {
  closeCredModal();
  // Render login page and open Storage admin tab, then prefill fields
  renderLogin();
  setTimeout(()=>{
    showLoginForm('storage');
    setTimeout(()=>{
      switchStorageTab('admin');
      const uEl = document.getElementById('sa-user');
      const pEl = document.getElementById('sa-pw');
      if (uEl) uEl.value = username;
      if (pEl) pEl.value = password;
      toast('Prefilled', 'Form login Admin telah terisi, silakan tekan Masuk untuk mengakses dashboard admin.', 'success');
    },100);
  },100);
}

function autoSwitchToAdmin(username, password) {
  // Confirm action: this will log out current user and login as the new admin
  confirmDlg('Logout & Login sebagai Admin?', 'Anda akan logout dari akun saat ini dan masuk sebagai Storage Admin. Lanjutkan?', ()=>{
    const d = STORAGE_USERS[username];
    if (!d) { toast('Akun admin tidak ditemukan', 'Tidak ada akun admin dengan username tersebut.', 'error'); return; }
    if (d.pw !== password) { toast('Kredensial tidak valid', 'Password yang disimpan tidak cocok.', 'error'); return; }
    // Build user object and login
    const user = {...d, username};
    loginSuccess(user);
  }, 'warning');
}

function acceptAdminSubscription(id) {
  const s = ST.subscriptions.find(x=>x.id===id); if(!s) return;
  if (s.status !== 'pending') {
    toast('Tidak Bisa', 'Hanya langganan dengan status menunggu yang bisa diaktifkan.', 'warning');
    return;
  }
  confirmDlg('Aktifkan Langganan?', 'Terima dan aktifkan gudang ini sebagai Storage Admin sekarang?', ()=>{
    s.status = 'active';

    // Add warehouse to user-owned warehouses and marketplace
    if (!ST.userWarehouses) ST.userWarehouses = [];
    ST.userWarehouses.push(s.pendingWarehouse);
    if (!WAREHOUSES.find(w=>w.id===s.pendingWarehouse.id)) {
      WAREHOUSES.push(s.pendingWarehouse);
    }

    // Persist current user admin info if it is this user
    if (ST.user?.username === s.userId) {
      ST.user.adminUsername = s.adminUsername;
      ST.user.adminPassword = s.adminPassword;
      saveSession();
    }

    saveStorageExtra(); saveData();
    addNotif('storage',{type:'subscription',title:'Langganan Diaktifkan',msg:`Gudang ${s.whName} sekarang aktif di marketplace.`,target:s.userId});
    toast('Langganan Diaktifkan', `${s.whName} telah aktif dan bisa mulai menerima booking.`, 'success');
    navTo('storage-subscribe');
  }, 'success');
}

function cancelSubscription(id) {
  const s = ST.subscriptions.find(x=>x.id===id); if(!s) return;
  const isPending = s.status === 'pending';
  confirmDlg(isPending ? 'Batalkan Permintaan?' : 'Batalkan Langganan?',
    isPending
      ? 'Jika dibatalkan, permintaan admin gudang akan dibatalkan dan akun admin akan dihapus. Lanjutkan?'
      : 'Jika dibatalkan, gudang akan ditarik dari marketplace dan akun admin akan dihapus. Lanjutkan?',
    ()=>{
      s.status = 'cancelled';

      if (!isPending) {
        if (ST.userWarehouses) {
          ST.userWarehouses = ST.userWarehouses.filter(w=>w.id!==s.whId);
        }
        const idx = WAREHOUSES.findIndex(w=>w.id===s.whId);
        if (idx>=0) WAREHOUSES.splice(idx,1);

        const affected = (ST.storageBookings||[]).filter(b=>b.whId===s.whId && !['cancelled','rejected','force_cancelled'].includes(b.status));
        affected.forEach(b=>{
          b.status = 'force_cancelled';
          b.refunded = true;
          addNotif('storage',{
            type:'booking',
            title:'❌ Booking Dibatalkan & Direfund',
            msg:`Booking ${b.whName} (${fmtDate(b.startDate)}–${fmtDate(b.endDate)}) dibatalkan karena pemilik membatalkan langganan. ${fmtRp(b.total)} direfund ke ${getPayLbl(b.payMethod)}.`,
            target: b.userId
          });
        });
      }

      const adminU = s.adminUsername || s.userId;
      if (STORAGE_USERS && STORAGE_USERS[adminU]) delete STORAGE_USERS[adminU];
      if (ST.storageUsers && ST.storageUsers[adminU]) delete ST.storageUsers[adminU];
      if (ST.user?.username===s.userId) {
        delete ST.user.adminUsername;
        delete ST.user.adminPassword;
        saveSession();
      }

      if (STORAGE_OTP) Object.keys(STORAGE_OTP).forEach(k=>{
        if (STORAGE_OTP[k].adminUsername===adminU) {
          delete STORAGE_OTP[k].adminUsername; delete STORAGE_OTP[k].adminPassword;
        }
      });

      saveStorageExtra(); saveData();
      addNotif('storage',{type:'subscription',title:isPending ? 'Permintaan Dibatalkan' : 'Langganan Dibatalkan',msg:isPending ? `Permintaan ${s.whName} dibatalkan.` : `Langganan ${s.whName} dibatalkan dan gudang ditarik dari marketplace.`,target:'spaceflow'});
      toast(isPending ? 'Permintaan Dibatalkan' : 'Langganan Dibatalkan', isPending ? `Permintaan ${s.whName} sudah dibatalkan.` : `${s.whName} sudah ditarik dari marketplace`, 'info');
      navTo('storage-subscribe');
    }, isPending ? 'warning' : 'danger');
}

function submitAddWarehouse() {
  const u = ST.user;
  if (!ST.userWarehouses) ST.userWarehouses=[];

  const name   = $('#sf-name')?.value?.trim();
  const type   = $('#sf-type')?.value;
  const price  = parseFloat($('#sf-price')?.value)||0;
  const area   = parseFloat($('#sf-area')?.value)||0;
  const height = parseFloat($('#sf-height')?.value)||0;
  const pallet = parseInt($('#sf-pallet')?.value)||0;
  const addr   = $('#sf-addr')?.value?.trim();
  const city   = $('#sf-city')?.value?.trim();
  const postal = $('#sf-postal')?.value?.trim()||'';
  const prov   = $('#sf-prov')?.value?.trim()||'Jawa Barat';
  const desc   = $('#sf-desc')?.value?.trim();
  const fac    = Array.from($$('#sf-fac input:checked')).map(c=>c.value);

  const errEl = $('#sf-err');
  const err = m => { if(errEl){errEl.textContent=m;errEl.style.display='block';} };
  if (errEl) errEl.style.display='none';

  if (!name)   return err('❌ Nama gudang wajib diisi.');
  if (!type)   return err('❌ Tipe gudang wajib dipilih.');
  if (!price||price<50000) return err('❌ Harga sewa minimal Rp 50.000/hari.');
  if (!area)   return err('❌ Luas gudang wajib diisi.');
  if (!height) return err('❌ Tinggi gudang wajib diisi.');
  if (area > (_subPlan.maxArea||99999))  return err(`❌ Luas melebihi batas plan (maks ${_subPlan.maxArea}m²).`);
  if (height > (_subPlan.maxHeight||99)) return err(`❌ Tinggi melebihi batas plan (maks ${_subPlan.maxHeight}m).`);
  if (!pallet) return err('❌ Kapasitas pallet wajib diisi.');
  if (!addr||!city||!desc) return err('❌ Alamat, kota, dan deskripsi wajib diisi.');

  const iconMap = {retail:'🏭',cold:'❄️',industrial:'🏗️',logistic:'🚛',ruko:'🏪',furniture:'🪑'};
  const wh = {
    id:'UWH'+genId(), name, admin:u.username, type,
    city, prov, addr, postal,
    area, height, pallet, price, desc, fac,
    icon: iconMap[type]||'🏭',
    rating:4.0, rev:0,
    createdAt: new Date().toISOString()
  };
  ST.userWarehouses.push(wh);
  saveStorageExtra(); saveData();

  closeModal('add-wh-modal');
  document.getElementById('add-wh-modal')?.remove();
  toast('Gudang Ditambahkan!',`${name} sudah aktif di marketplace`,'success');
  navTo('my-warehouses');
}

/* ── IoT DASHBOARD ─────────────────────────────────────── */
function pgIoT() {
  const eco = ST.eco;
  const isOwner = ST.user.role === 'owner';

  // Pilih ruang sesuai ekosistem
  let rooms, ecoLabel, ecoIcon, locLabel;
  if (eco === 'campus' || isOwner) {
    rooms    = eco === 'campus' ? CAMPUS_ROOMS : [...CAMPUS_ROOMS, ...LIB_ROOMS];
    ecoLabel = eco === 'campus' ? 'Campus – Universitas Pakuan' : 'Semua Ekosistem (Owner View)';
    ecoIcon  = eco === 'campus' ? '🏫' : '🌐';
    locLabel = 'Gedung';
  } else if (eco === 'library') {
    rooms    = LIB_ROOMS;
    ecoLabel = 'Perpustakaan Universitas Pakuan';
    ecoIcon  = '📚';
    locLabel = 'Perpustakaan';
  } else {
    // storage — gudang tidak punya sensor IoT suhu/udara seperti ruangan,
    // tapi kita tampilkan data simulasi berdasarkan warehouse
    rooms    = [];
    ecoLabel = 'Storage Ecosystem';
    ecoIcon  = '🏢';
    locLabel = 'Gudang';
  }

  // Hitung rata-rata IoT (hanya untuk ruangan yang punya sensor)
  const avgTemp  = rooms.length ? (rooms.reduce((s,r)=>s+r.iot.temp,0)/rooms.length).toFixed(1) : '–';
  const avgHum   = rooms.length ? (rooms.reduce((s,r)=>s+r.iot.hum,0)/rooms.length).toFixed(0) : '–';
  const avgAir   = rooms.length ? (rooms.reduce((s,r)=>s+r.iot.air,0)/rooms.length).toFixed(0) : '–';
  const sensors  = rooms.length;

  // Storage: tampilkan sensor simulasi gudang, termasuk gudang yang didaftarkan admin
  const availableWarehouses = eco === 'storage' ? getAllWH() : [];
  const storageIoT = eco === 'storage' ? availableWarehouses.map(w=>({
    name: w.name, icon: w.icon, id: w.id,
    loc: w.city,
    temp: (18 + Math.random()*10).toFixed(1),
    hum:  (50 + Math.random()*20).toFixed(0),
    air:  (88 + Math.random()*10).toFixed(0),
    light:(200 + Math.random()*200).toFixed(0),
    noise:(30 + Math.random()*20).toFixed(0),
    wifi: (-40 - Math.random()*20).toFixed(0),
    status: w.status
  })) : [];

  return `
  <div class="page-hd">
    <div>
      <div class="page-title">🌡️ IoT Smart Monitoring</div>
      <div class="page-sub">${ecoIcon} ${ecoLabel} · Sensor update setiap 5 detik</div>
    </div>
    <span class="badge ${eco==='campus'?'bg-blue':eco==='storage'?'bg-yellow':'bg-green'}" style="font-size:12px;padding:6px 14px">${ecoIcon} ${eco==='campus'?'Campus':eco==='storage'?'Storage':'Library'} Ecosystem</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-lbl">Avg Suhu</div><div class="stat-val">${eco==='storage'?'22.4':avgTemp}°C</div><div class="stat-chg up">Normal</div><div class="stat-ico">🌡️</div></div>
    <div class="stat-card" style="--accent:var(--blue)"><div class="stat-lbl">Avg Kelembapan</div><div class="stat-val">${eco==='storage'?'62':avgHum}%</div><div class="stat-chg up">Optimal</div><div class="stat-ico">💧</div></div>

/* ── REVIEWS ───────────────────────────────────────────── */
let _revStar=0;
function pgReviews() {
  const eco = ST.eco;
  const isOwner = ST.user.role === 'owner';

  // Pilih data sesuai ekosistem
  let ecoRooms, ecoLabel, ecoIcon, ecoColor, ecoAccent;
  if (eco === 'campus') {
    ecoRooms  = CAMPUS_ROOMS;
    ecoLabel  = 'Ruang Kuliah – Campus';
    ecoIcon   = '🏫';
    ecoColor  = 'var(--campus)';
    ecoAccent = 'var(--campus-light)';
  } else if (eco === 'storage') {
    ecoRooms  = getAllWH();
    ecoLabel  = 'Gudang – Storage';
    ecoIcon   = '🏢';
    ecoColor  = 'var(--storage)';
    ecoAccent = 'var(--storage-light)';
  } else if (eco === 'library') {
    ecoRooms  = LIB_ROOMS;
    ecoLabel  = 'Ruang Library';
    ecoIcon   = '📚';
    ecoColor  = 'var(--library)';
    ecoAccent = 'var(--library-light)';
  } else {
    // owner: lihat semua
    ecoRooms  = [...CAMPUS_ROOMS, ...LIB_ROOMS, ...getAllWH()];
    ecoLabel  = 'Semua Ekosistem';
    ecoIcon   = '🌐';
    ecoColor  = '#8b5cf6';
    ecoAccent = '#ede9fe';
  }

  const topRated = [...ecoRooms].sort((a,b)=>b.rating-a.rating).slice(0,6);

  // Filter review hanya untuk ekosistem yang relevan
  const ecoRoomIds = new Set(ecoRooms.map(r=>r.id));
  const myEcoReviews = isOwner
    ? ST.reviews
    : ST.reviews.filter(r=>ecoRoomIds.has(r.roomId));

  return `
  <div class="page-hd">
    <div>
      <div class="page-title">⭐ Rating & Review</div>
      <div class="page-sub">${ecoIcon} ${ecoLabel}</div>
    </div>
    <span class="badge" style="background:${ecoAccent};color:${ecoColor};font-size:12px;padding:6px 14px">${ecoIcon} ${eco==='campus'?'Campus':eco==='storage'?'Storage':eco==='library'?'Library':'All Ecosystems'}</span>
  </div>

  <!-- TOP RATED - HANYA EKOSISTEM INI -->
  <div class="card" style="margin-bottom:18px">
    <div class="sec-title" style="margin-bottom:14px">🏆 Top Rated – ${ecoLabel}</div>
    <div class="room-grid">
      ${topRated.map(r=>{
        const isWH = eco==='storage';
        return `<div class="room-card" onclick="navTo('${eco==='campus'?'campus-rooms':eco==='storage'?'storage-market':'library-rooms'}')">
          <div class="room-thumb" style="height:110px;font-size:44px;background:linear-gradient(135deg,${ecoAccent},${ecoColor}18)">${r.icon}</div>
          <div class="room-body">
            <div class="room-name">${r.name}</div>
            <div class="room-meta">
              ${r.faculty?`<span>🏛️ ${r.faculty}</span>`:''}
              ${r.city?`<span>📍 ${r.city}</span>`:''}
              ${r.type?`<span>📂 ${r.type}</span>`:''}
              ${r.cap?`<span>👥 ${r.cap}</span>`:''}
              ${r.area?`<span>📐 ${r.area}m²</span>`:''}
            </div>
            <div class="room-foot">
              ${renderStars(Math.floor(r.rating))}
              <span style="font-size:14px;font-weight:800;color:var(--yellow)">${r.rating}/5</span>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${r.rev||r.reviews||0} ulasan</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <!-- FORM REVIEW -->
  <div class="card">
    <div class="sec-hd">
      <div class="sec-title">✍️ Tulis Review ${ecoLabel}</div>
    </div>
    <div style="max-width:500px">
      <div class="fgrp">
        <label class="flbl">Pilih ${eco==='storage'?'Gudang':'Ruang'} <span class="freq">*</span></label>
        <select class="fselect" id="rv-room">
          <option value="">-- Pilih ${eco==='storage'?'Gudang':'Ruang'} --</option>
          ${ecoRooms.map(r=>`<option value="${r.id}">${r.icon} ${r.name}</option>`).join('')}
        </select>
      </div>
      <div class="fgrp">
        <label class="flbl">Rating <span class="freq">*</span></label>
        <div style="display:flex;gap:10px;font-size:30px;cursor:pointer" id="rv-stars">
          ${[1,2,3,4,5].map(n=>`<span onclick="setRevStar(${n})" data-s="${n}" style="color:var(--border);transition:color .15s;line-height:1" title="${n} bintang">★</span>`).join('')}
        </div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px" id="rv-star-label">Klik bintang untuk memberi rating</div>
      </div>
      <div class="fgrp">
        <label class="flbl">Ulasan <span class="freq">*</span></label>
        <textarea class="ftextarea" id="rv-text" placeholder="Ceritakan pengalaman Anda menggunakan ${eco==='storage'?'gudang ini':'ruangan ini'}..."></textarea>
      </div>
      <button class="btn btn-lg" style="background:${ecoColor};color:#fff" onclick="submitRev()">Kirim Review ⭐</button>
    </div>

    <div class="divider"></div>

    <!-- DAFTAR REVIEW - HANYA EKOSISTEM INI -->
    <div class="sec-hd" style="margin-bottom:12px">
      <div class="sec-title">💬 Ulasan Terbaru – ${ecoLabel}</div>
      <span style="font-size:12px;color:var(--text-muted)">${myEcoReviews.length} ulasan</span>
    </div>
    <div id="rev-list">
      ${myEcoReviews.length === 0
        ? `<div style="color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center">
             <div style="font-size:36px;opacity:.4;margin-bottom:8px">💬</div>
             Belum ada review untuk ${ecoLabel}.<br>Jadilah yang pertama!
           </div>`
        : myEcoReviews.map(r=>`
            <div style="padding:14px 0;border-bottom:1px solid var(--border-light)">
              <div style="display:flex;gap:12px">
                <div style="width:32px;height:32px;border-radius:8px;background:${ecoAccent};display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">👤</div>
                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <span style="font-size:13px;font-weight:700">${r.userName}</span>
                    ${renderStars(r.star)}
                    <span style="font-size:11px;color:var(--text-muted)">${r.time}</span>
                  </div>
                  <div style="font-size:13px;margin-top:5px;line-height:1.5">${r.text}</div>
                  <div style="font-size:11px;color:${ecoColor};margin-top:4px;font-weight:600">${ecoIcon} ${r.roomName}</div>
                </div>
              </div>
            </div>`).join('')}
    </div>
  </div>`;
}

function setRevStar(n) {
  _revStar = n;
  document.querySelectorAll('#rv-stars span').forEach((el,i) => el.style.color = i<n ? '#f59e0b' : 'var(--border)');
  const lbl = ['','Sangat Buruk','Buruk','Cukup','Baik','Sangat Baik'][n];
  const lblEl = document.getElementById('rv-star-label');
  if (lblEl) lblEl.textContent = `${n} Bintang – ${lbl}`;
}

function submitRev() {
  const roomId = $('#rv-room')?.value;
  const text   = $('#rv-text')?.value?.trim();
  if (!roomId || !_revStar || !text) {
    toast('Lengkapi review','Pilih ruang, beri bintang, dan tulis ulasan','error'); return;
  }
  const eco = ST.eco;
  const allR = eco==='campus' ? CAMPUS_ROOMS : eco==='storage' ? getAllWH() : eco==='library' ? LIB_ROOMS : [...CAMPUS_ROOMS,...LIB_ROOMS,...getAllWH()];
  const room = allR.find(r=>r.id===roomId);
  ST.reviews.unshift({
    id: genId(), roomId, roomName: room?.name||roomId,
    star: _revStar, text,
    eco: eco,
    userId: ST.user.username, userName: ST.user.name,
    time: 'Baru saja'
  });
  saveData(); _revStar=0;
  toast('Review Terkirim!','Terima kasih atas ulasan Anda','success');
  navTo('reviews-pg');
}

/* ── NOTIFICATION MODAL ────────────────────────────────── */
function renderNotifModal() {
  return `<div class="modal-overlay" id="notif-modal"><div class="modal-box" style="max-width:420px"><div class="modal-hd"><span class="modal-title">🔔 Notifikasi</span><button class="modal-close">✕</button></div><div class="modal-body" id="notif-modal-body" style="max-height:400px;overflow-y:auto"></div></div></div>`;
}
function openNotifModal() {
  const notifs=getMyNotifs();
  $('#notif-modal-body').innerHTML = !notifs.length
    ? `<div class="empty" style="padding:32px"><div class="empty-ico">🔔</div><div class="empty-ttl">Tidak ada notifikasi</div></div>`
    : notifs.slice(0,15).map(n=>`<div class="notif-item"><div class="notif-dot-c ${n.read?'r':''}"></div><div><div style="font-size:13px;font-weight:${n.read?500:700}">${n.title}</div><div style="font-size:12px;color:var(--text-muted);margin-top:2px">${n.msg}</div><div style="font-size:11px;color:var(--text-light);margin-top:3px">${n.time}</div></div></div>`).join('');
  // Mark all read
  getMyNotifs().forEach(n=>n.read=true); saveData(); updateNotifBadge();
  openModal('notif-modal');
}

/* ── AI CHATBOT ────────────────────────────────────────── */
function renderAIFab() {
  return `
  <button class="ai-fab" onclick="toggleAI()" title="SPACE FLOW AI">🤖</button>
  <div class="ai-panel" id="ai-panel">
    <div class="ai-hd">
      <div class="ai-ava">🤖</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13.5px;font-weight:700">SPACE FLOW AI</div>
        <div style="font-size:11px;color:var(--text-muted)">Asisten Smart Ecosystem ● Online</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="toggleAI()">✕</button>
    </div>
    <div class="ai-msgs" id="ai-msgs"></div>
    <div class="ai-input-row">
      <input type="text" id="ai-inp" placeholder="Tanya sesuatu..." onkeydown="if(event.key==='Enter')sendAI()">
      <button class="btn btn-primary btn-sm" onclick="sendAI()">➤</button>
    </div>
  </div>`;
}
let _aiInit=false;
function toggleAI() {
  const p=$('#ai-panel'); p.classList.toggle('open');
  if (!_aiInit&&p.classList.contains('open')) { _aiInit=true; setTimeout(()=>addAIMsg('bot',`Halo! Saya <b>SPACE FLOW AI</b> 🤖<br><br>Bisa bantu:<br>• 🏫 Info & cari ruang kampus<br>• 🏢 Rekomendasi gudang storage<br>• 📚 Booking library<br>• 📊 Analytics & IoT data<br>• 💰 Info harga & kalkulasi<br><br>Tanyakan apa saja! 🚀`),400); }
}
function addAIMsg(role, html) {
  const ms=$('#ai-msgs'); if(!ms)return;
  const el=document.createElement('div'); el.className=`ai-msg ${role}`; el.innerHTML=html;
  ms.appendChild(el); ms.scrollTop=ms.scrollHeight;
}
function showTyping() {
  const ms=$('#ai-msgs'); if(!ms)return;
  const el=document.createElement('div'); el.className='ai-typing'; el.id='ai-type'; el.innerHTML='<span></span><span></span><span></span>';
  ms.appendChild(el); ms.scrollTop=ms.scrollHeight;
}
function sendAI() {
  const inp=$('#ai-inp'); const txt=inp?.value.trim(); if(!txt)return;
  addAIMsg('usr',txt); inp.value=''; showTyping();
  setTimeout(()=>{ $('#ai-type')?.remove(); addAIMsg('bot',genAIReply(txt)); },600+Math.random()*700);
}
function genAIReply(q) {
  const ql=q.toLowerCase();
  const avCampus=CAMPUS_ROOMS.filter(r=>r.status==='available');
  const avLib=LIB_ROOMS.filter(r=>r.status==='available');
  if(ql.match(/ruang.*(kosong|tersedia|available)/)||ql.match(/(kosong|tersedia|available).*(ruang)/))
    return `📊 <b>Ruang Tersedia Sekarang:</b><br><br>🏫 <b>Campus (${avCampus.length} ruang):</b><br>${avCampus.slice(0,4).map(r=>`• ${r.name} – ${r.faculty} – ${r.cap} org`).join('<br>')}<br><br>📚 <b>Library (${avLib.length} ruang):</b><br>${avLib.slice(0,3).map(r=>`• ${r.name} – ${r.cap} org – ${fmtRp(r.price)}/jam`).join('<br>')}`;
  if(ql.match(/gudang|storage|warehouse/))
    return `🏢 <b>Gudang Tersedia:</b><br><br>${getAllWH().map(w=>`• <b>${w.name}</b><br>  📍 ${w.city} · ${w.area}m² · <b>${fmtRp(w.price)}/hari</b>`).join('<br><br>')}`;
  if(ql.match(/harga|biaya|tarif|bayar/))
    return `💰 <b>Info Harga SPACE FLOW:</b><br><br>🏫 <b>Campus:</b> <span style="color:var(--green)">GRATIS</span><br><br>📚 <b>Library:</b><br>• Study Room: ${fmtRp(15000)}/jam<br>• Private Room: ${fmtRp(25000)}/jam<br>• Meeting Room: ${fmtRp(50000)}/jam<br>• Discussion: ${fmtRp(30000)}/jam<br><br>🏢 <b>Storage/hari:</b><br>• Retail: ${fmtRp(500000)}<br>• Cold Storage: ${fmtRp(750000)}<br>• Industrial: ${fmtRp(2000000)}<br>• Smart Ruko: ${fmtRp(250000)}`;
  if(ql.match(/iot|suhu|sensor|temperature/))
    return `🌡️ <b>IoT Real-time (${CAMPUS_ROOMS[0].name}):</b><br><br>🌡️ Suhu: ${CAMPUS_ROOMS[0].iot.temp}°C<br>💧 Kelembapan: ${CAMPUS_ROOMS[0].iot.hum}%<br>🌬️ Kualitas Udara: ${CAMPUS_ROOMS[0].iot.air} AQI<br>💡 Cahaya: ${CAMPUS_ROOMS[0].iot.light} lux<br>🔊 Kebisingan: ${CAMPUS_ROOMS[0].iot.noise} dB<br>📶 WiFi: ${CAMPUS_ROOMS[0].iot.wifi} dBm<br><br>Data diperbarui setiap 5 detik otomatis ✅`;
  if(ql.match(/analytic|statistik|data|booking/))
    return `📊 <b>Analytics Platform:</b><br><br>📋 Campus Booking: <b>${ST.campusBookings.length}</b><br>🏢 Storage Booking: <b>${ST.storageBookings.length}</b><br>📚 Library Booking: <b>${ST.libraryBookings.length}</b><br>💰 Revenue Storage: <b>${fmtRp(ST.storageBookings.reduce((s,b)=>s+b.total,0))}</b><br>💰 Revenue Library: <b>${fmtRp(ST.libraryBookings.filter(b=>b.status==='confirmed').reduce((s,b)=>s+b.total,0))}</b>`;
  if(ql.match(/unpak|universitas pakuan|kampus/))
    return `🏛️ <b>Universitas Pakuan Bogor</b><br><br>📍 Jl. Pakuan, Tegallega, Bogor Tengah, Kota Bogor, Jawa Barat 16143<br><br>Fakultas: 💼 FEB · ⚖️ Hukum · 🔬 MIPA · 📡 FISIB · ⚙️ Teknik<br><br>Ruang tersedia: <b>${avCampus.length}/${CAMPUS_ROOMS.length}</b> ruang`;
  if(ql.match(/halo|hai|hi|hello|selamat|pagi|siang|malam/))
    return `Halo! 😊 Ada yang bisa saya bantu?<br><br>Saya bisa membantu dengan:<br>• Cari ruang kosong<br>• Info harga & sewa<br>• Data IoT real-time<br>• Analytics booking<br>• Rekomendasi gudang`;
  return `Untuk pertanyaan tentang <b>"${q}"</b>, silakan:<br><br>1. 🏫 Lihat ruang kuliah di menu Campus<br>2. 🏢 Cari gudang di Storage Marketplace<br>3. 📚 Booking di Library Rooms<br>4. 📊 Cek Analytics Dashboard<br><br>Atau tanyakan lebih spesifik! 😊`;
}

/* ── IoT LIVE UPDATE ────────────────────────────────────── */
setInterval(()=>{
  document.querySelectorAll('[data-iot]').forEach(el=>{
    const base=parseFloat(el.dataset.base||el.textContent);
    const v=parseFloat(el.dataset.var||0.5);
    el.textContent=(base+(Math.random()-.5)*v).toFixed(1);
  });
},5000);

/* ══════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════ */
let _bootDone = false;
function finalizeBoot() {
  if (_bootDone) return;
  _bootDone = true;
  try {
    const s = document.getElementById('splash');
    if (s) {
      s.classList.add('out');
      setTimeout(()=>{ s.remove(); }, 500);
    }
  } catch(e){ console.error('finalizeBoot error', e); }
  document.getElementById('app').classList.add('ready');
  try { if (loadSession()) { renderApp(); } else { renderLogin(); } } catch(e){ console.error('render error', e); renderLogin(); }
}

document.addEventListener('DOMContentLoaded',()=>{
  applyTheme();
  // Normal splash flow
  setTimeout(()=>{
    try {
      const s=document.getElementById('splash');
      if (s) s.classList.add('out');
      setTimeout(finalizeBoot, 500);
    } catch(e) { console.error(e); finalizeBoot(); }
  },1900);
  // Failsafe: ensure splash removed after 6s even if errors occur
  setTimeout(finalizeBoot, 6000);
});

// If DOMContentLoaded already fired before listener attached, run finalizeBoot
if (document.readyState !== 'loading') {
  setTimeout(()=>{ try { const s=document.getElementById('splash'); if (s) s.classList.add('out'); setTimeout(finalizeBoot,500);}catch(e){ finalizeBoot(); } }, 50);
}
</script>
